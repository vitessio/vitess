name: Static Code Checks, Etc.

on:
  push:
    branches:
      - "main"
      - "release-[0-9]+.[0-9]"
    tags: '**'
  pull_request:
    branches: '**'

concurrency:
  group: format('{0}-{1}', ${{ github.ref }}, 'Static Code Checks, Etc.')
  cancel-in-progress: true

permissions: read-all

jobs:
  build:
    name: Static Code Checks Etc
    # vitess-security is private, so its GitHub-hosted runners are billed and
    # smaller; it uses a CNCF VM the size of the public ubuntu-24.04 runner
    # instead.
    runs-on: ${{ github.repository == 'vitessio/vitess-security' && 'cncf-ubuntu-24.04-4-16-x86' || 'ubuntu-24.04' }}
    env:
      # Build everything the way the go_cache_warm workflow warms it, so the
      # checks reuse its build, unit and tools build cache entries. Nothing
      # under go/ uses cgo.
      CGO_ENABLED: "0"
      GOFLAGS: -trimpath

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Skip CI
        run: |
          if [[ "${{contains( github.event.pull_request.labels.*.name, 'Skip CI')}}" == "true" ]]; then
            echo "skipping CI due to the 'Skip CI' label"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its first parent, for the path filter.
          fetch-depth: 2
          persist-credentials: 'false'

      # Only uploads dependency data for FOSSA's license tracking; the policy
      # check (skip-test) is off, so a pull request gains nothing from it.
      # Pushes keep main, the release branches and the tags scanned.
      - name: Run FOSSA scan and upload build data
        if: github.event_name == 'push'
        timeout-minutes: 5
        uses: fossa-contrib/fossa-action@d28f0c947e7406706981a62a91ecc009bcc39fd7 # v4.0.0
        with:
          # This is a push-only API token: https://github.com/fossa-contrib/fossa-action#push-only-api-token
          fossa-api-key: f62c11ef0c249fef239947f01279aa0f
          github-token: ${{ github.token }}

      - name: Find the base of the pull request's merge commit
        # github.event.pull_request.base.sha is not updated when the base branch
        # moves, so paths-filter would also count the base branch's newer commits.
        # With token: '', paths-filter diffs against `base` on pull_request
        # events too (see its README); action.yml's input description is stale.
        id: merge-base
        if: github.event_name == 'pull_request'
        run: echo "sha=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"

      - name: Check for changes in files
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          token: ''
          base: ${{ steps.merge-base.outputs.sha }}
          filters: |
            go_files:
              - '**/*.go'
              - '*.go'
              - 'go.sum'
              - 'go.mod'
              - 'tools/**/go.mod'
              - 'tools/**/go.sum'
              - '.github/workflows/static_checks_etc.yml'
            logcheck:
              - 'go/tools/logcheck/packages.txt'
              - 'tools/check_logcheck.sh'
              - 'Makefile'
            parser_changes:
              - 'go/vt/sqlparser/**'
              - 'go.sum'
              - 'go.mod'
              - 'build.env'
              - 'bootstrap.sh'
              - 'tools/**'
              - '.github/workflows/static_checks_etc.yml'
            proto_changes:
              - 'bootstrap.sh'
              - 'tools/**'
              - 'build.env'
              - 'go.sum'
              - 'go.mod'
              - 'Makefile'
              - 'go/vt/proto/**'
              - 'proto/*.proto'
              - '.github/workflows/static_checks_etc.yml'
            sizegen:
              - 'go/**/*.go'
              - 'test.go'
              - 'Makefile'
              - 'build.env'
              - 'go.sum'
              - 'go.mod'
              - 'tools/**'
              - 'bootstrap.sh'
              - '.github/workflows/static_checks_etc.yml'
            visitor:
              - 'go/tools/asthelpergen/**'
              - 'go/vt/sqlparser/**'
              - 'Makefile'
              - 'build.env'
              - 'go.sum'
              - 'go.mod'
              - 'tools/**'
              - 'bootstrap.sh'
              - 'misc/git/hooks/asthelpers'
              - '.github/workflows/static_checks_etc.yml'
            astfmt:
              - 'go/tools/astfmtgen/**'
              - 'go/vt/sqlparser/**'
              - 'Makefile'
              - 'build.env'
              - 'go.sum'
              - 'go.mod'
              - 'tools/**'
              - 'bootstrap.sh'
              - '.github/workflows/static_checks_etc.yml'
            end_to_end:
              - 'docker/**'
              - 'test.go'
              - 'Makefile'
              - 'bootstrap.sh'
              - '.github/workflows/static_checks_etc.yml'
            ci_config:
              - 'test/config.json'
              - 'test/config_partial_keyspace.json'
              - '.github/workflows/static_checks_etc.yml'
            release_notes:
              - 'changelog/**'
              - './go/tools/releases/**'
              - '.github/workflows/static_checks_etc.yml'
            github:
              - '.github/**'
              - 'Makefile'
              - '.github/workflows/static_checks_etc.yml'

      - name: Set up Go
        if: (steps.changes.outputs.go_files == 'true' || steps.changes.outputs.parser_changes == 'true' || steps.changes.outputs.proto_changes == 'true' || steps.changes.outputs.logcheck == 'true')
        uses: $/.github/actions/setup-go
        with:
          build-cache: build,unit,tools
          go-tools: addlicense,gofumpt,goimports,golangci-lint,goyacc

      - name: Tune the OS
        if: steps.changes.outputs.go_files == 'true'
        timeout-minutes: 5
        uses: $/.github/actions/tune-os

      - name: Get dependencies
        if: (steps.changes.outputs.parser_changes == 'true' || steps.changes.outputs.go_files == 'true')
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y make unzip g++ etcd-client etcd-server curl git wget
          sudo service etcd stop

      - name: Run make minimaltools
        if: (steps.changes.outputs.parser_changes == 'true' || steps.changes.outputs.go_files == 'true')
        timeout-minutes: 5
        run: |
          make minimaltools

      - name: Install yamllint
        if: steps.changes.outputs.github == 'true'
        run: pip install yamllint==1.38.0

      - name: check_go_versions
        run:
          tools/check_go_versions.sh || exit 1

      - name: check_make_parser
        if: (steps.changes.outputs.parser_changes == 'true' || steps.changes.outputs.go_files == 'true')
        run: |
          tools/check_make_parser.sh || exit 1

      - name: check_make_sizegen
        if: (steps.changes.outputs.sizegen == 'true' || steps.changes.outputs.go_files == 'true')
        run: |
          tools/check_make_sizegen.sh || exit 1

      - name: check_make_visitor
        if: (steps.changes.outputs.visitor == 'true' || steps.changes.outputs.go_files == 'true')
        run: |
          misc/git/hooks/asthelpers || exit 1
          
      - name: check_ast_format_fast
        if: (steps.changes.outputs.astfmt == 'true' || steps.changes.outputs.go_files == 'true')
        run: |
          ./tools/check_astfmtgen.sh || exit 1

      - name: run ensure_bootstrap_version
        if: steps.changes.outputs.end_to_end == 'true'
        run: |
          make ensure_bootstrap_version
          git status
          test -z "$(git diff-index --name-only HEAD --)" || exit 1

      - name: Check .github YAML configs
        if: steps.changes.outputs.github == 'true'
        run: |
          yamllint -d "{extends: relaxed, rules: {indentation: disable, line-length: disable, trailing-spaces: disable}}" \
            .github/*.yml \
            .github/ISSUE_TEMPLATE/*.yml \
            .github/workflows/*.yml

      # Runs the golangci-lint build pinned in tools/golangci-lint, the same
      # one "make lint" runs, which the tools build cache entry holds. With
      # the analysis cache that setup-go restores, it only analyzes the
      # packages that changed and those that depend on them. The problem
      # matcher of actions/setup-go turns the issues it reports into
      # annotations.
      - name: Run golangci-lint
        if: steps.changes.outputs.go_files == 'true'
        timeout-minutes: 15
        run: |
          lint() {
            go run -trimpath -modfile=tools/golangci-lint/go.mod github.com/golangci/golangci-lint/v2/cmd/golangci-lint "$@"
          }
          lint config verify
          lint run --timeout 10m ./go/...

      - name: Run logcheck
        if: (steps.changes.outputs.go_files == 'true' || steps.changes.outputs.logcheck == 'true')
        timeout-minutes: 10
        run: |
          make lint-logcheck

      - name: Check license headers
        if: steps.changes.outputs.go_files == 'true'
        timeout-minutes: 5
        run: |
          tools/check_license_headers.sh

      - name: Run go mod tidy
        if: steps.changes.outputs.go_files == 'true'
        run: |
          set -e
          go mod tidy
          for mod in tools/*/go.mod; do
            (cd "$(dirname "$mod")" && go mod tidy)
          done
          output=$(git status -s)
          if [ -z "${output}" ]; then
            exit 0
          fi
          echo 'We wish to maintain a tidy state for go mod. Please run `go mod tidy` in the affected module on your branch, commit and push again.'
          echo 'Running `go mod tidy` on this CI test yields with the following changes:'
          echo "$output"
          exit 1


      - name: Setup Node
        if: steps.changes.outputs.proto_changes == 'true'
        # zizmor: ignore[cache-poisoning] this workflow publishes no artifacts
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # make proto requires newer node than the pre-installed one
          node-version: '24.21.0'

      - name: check_make_proto
        if: steps.changes.outputs.proto_changes == 'true'
        run: |
          tools/check_make_proto.sh || exit 1

      - name: Check CI test configuration
        if: (steps.changes.outputs.go_files == 'true' || steps.changes.outputs.ci_config == 'true')
        run: |
          go run ./go/tools/ci-config || exit 1

      - name: Check changelog
        if: steps.changes.outputs.release_notes == 'true'
        run: |
          set -e
          go run ./go/tools/releases/releases.go
          output=$(git status -s)
          if [ -z "${output}" ]; then
            exit 0
          fi
          echo 'We wish to maintain a consistent changelog directory, please run `go run ./go/tools/releases/releases.go`, commit and push again.'
          echo 'Running `go run ./go/tools/releases/releases.go` on CI yields the following changes:'
          echo "$output"
          echo ""
          exit 1

      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          annotations: true
