name: Query Serving (Queries - 2) Next Release - Upgrade Downgrade Testing
on:
  push:
    branches:
      - "main"
      - "release-[0-9]+.[0-9]"
    tags: '**'
  pull_request:
    branches: '**'

concurrency:
  group: format('{0}-{1}', ${{ github.ref }}, 'Upgrade Downgrade Testing Query Serving (Queries - 2) Next Release')
  cancel-in-progress: true

permissions:
  contents: read

# This test ensures that our end-to-end tests work using Vitess components
# (vtgate, vttablet, etc) built on different versions.

jobs:

  # Path filtering and release-branch discovery run once here, on a
  # GitHub-hosted runner, so that the test job below (on a large runner) is not
  # started at all when nothing relevant changed or there is no next release.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      end_to_end: ${{ steps.changes.outputs.end_to_end }}
      next_release_ref: ${{ steps.output-next-release-ref.outputs.next_release_ref }}
    steps:
    - name: Check out commit's code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        # Full history is needed to list the release branches.
        fetch-depth: 0
        persist-credentials: 'false'

    - name: Set output with latest release branch
      id: output-next-release-ref
      env:
        BASE_REF: ${{ github.base_ref }}
        REF: ${{ github.ref }}
      run: |
        next_release_ref=$(./tools/get_next_release.sh "$BASE_REF" "$REF")
        echo $next_release_ref
        echo "next_release_ref=${next_release_ref}" >> $GITHUB_OUTPUT

    - name: Check for changes in relevant files
      uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
      id: changes
      with:
        token: ''
        filters: |
          end_to_end:
            - 'test/config.json'
            - 'go/**'
            - 'go/**/*.go'
            - 'test.go'
            - 'Makefile'
            - 'build.env'
            - 'go.sum'
            - 'go.mod'
            - 'proto/*.proto'
            - 'tools/**'
            - 'config/**'
            - 'bootstrap.sh'
            - '.github/workflows/upgrade_downgrade_test_query_serving_queries_2_next_release.yml'
            - '.github/actions/setup-mysql/action.yml'
            - '.github/actions/setup-go/action.yml'

  upgrade_downgrade_test:
    needs: changes
    # Runs when the gate found relevant changes. Also runs when the gate did not
    # succeed (it failed, or was cancelled by its timeout) or the PR has the
    # 'Skip CI' label, so that those fail this job instead of silently skipping
    # a required status check.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || contains(github.event.pull_request.labels.*.name, 'Skip CI') || (needs.changes.outputs.end_to_end == 'true' && needs.changes.outputs.next_release_ref != '')) }}
    timeout-minutes: 60
    name: Run Upgrade Downgrade Test - Query Serving (Queries - 2) Next Release
    # The large runner is only claimed when the tests will actually run; a
    # failed or cancelled gate and the 'Skip CI' label only report a failure.
    runs-on: ${{ needs.changes.result == 'success' && needs.changes.outputs.end_to_end == 'true' && !contains(github.event.pull_request.labels.*.name, 'Skip CI') && github.repository == 'vitessio/vitess' && 'oracle-vm-16cpu-64gb-x86-64' || 'ubuntu-24.04' }}

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
      with:
        egress-policy: audit

    - name: Skip CI
      run: |
        if [[ "${{contains( github.event.pull_request.labels.*.name, 'Skip CI')}}" == "true" ]]; then
          echo "skipping CI due to the 'Skip CI' label"
          exit 1
        fi

    - name: Fail if the gate job failed
      if: needs.changes.result != 'success'
      run: exit 1

    - name: Check out commit's code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: 'false'

    - name: Tune the OS
      uses: $/.github/actions/tune-os

    - name: Set up python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0

    - name: Setup MySQL
      uses: $/.github/actions/setup-mysql
      with:
        flavor: mysql-8.4

    - name: Get base dependencies
      timeout-minutes: 10
      run: |
        sudo DEBIAN_FRONTEND="noninteractive" apt-get update

        # Install everything else we need, and configure
        sudo apt-get install -y make unzip g++ etcd-client etcd-server curl git wget
        
        sudo service etcd stop

    # Checkout to the next release of Vitess
    - name: Check out other version's code (${{ needs.changes.outputs.next_release_ref }})
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        ref: ${{ needs.changes.outputs.next_release_ref }}
        persist-credentials: 'false'

    - name: Set up Go
      uses: $/.github/actions/setup-go
      with:
        # Only the current commit's tree feeds the shared Go caches.
        cache: 'false'

    - name: Building next release's binaries
      timeout-minutes: 10
      run: |
        source build.env
        NOVTADMINBUILD=1 make build
        mkdir -p /tmp/vitess-build-other/
        cp -R bin /tmp/vitess-build-other/
        rm -Rf bin/*

    # Checkout to this build's commit
    - name: Check out commit's code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: 'false'

    - name: Set up Go
      uses: $/.github/actions/setup-go
      with:
        # This job builds two trees into the same GOMODCACHE/GOCACHE, so it
        # must not be the one saving the branch caches; restore on PRs only.
        cache: ${{ github.event_name == 'pull_request' }}

    - name: Building the binaries for this commit
      timeout-minutes: 10
      run: |
        source build.env
        NOVTADMINBUILD=1 make build
        mkdir -p /tmp/vitess-build-current/
        cp -R bin /tmp/vitess-build-current/

    - name: Convert ErrorContains checks to Error checks
      run: |
        find ./go/test/endtoend -name '*.go' -exec sed -i 's/ErrorContains/Error/g' {} +
        find ./go/test/endtoend -name '*.go' -exec sed -i 's/EqualError/Error/g' {} +

    # Swap the binaries in the bin. Use vtgate version n+1 and keep vttablet at version n
    - name: Use next release's VTGate
      run: |
        source build.env
        rm -f $PWD/bin/vtgate
        cp /tmp/vitess-build-other/bin/vtgate $PWD/bin/vtgate
        vtgate --version

    # Running a test with vtgate at version n+1 and vttablet at version n
    - name: Run query serving tests (vtgate=N+1, vttablet=N)
      run: |
        rm -rf /tmp/vtdataroot
        mkdir -p /tmp/vtdataroot

        source build.env
        go run test.go -skip-build -keep-data=false -docker=false -print-log -follow -tag upgrade_downgrade_query_serving_queries_2

    # Swap the binaries again. This time, vtgate will be at version n, and vttablet will be at version n+1
    - name: Use current version VTGate, and other version VTTablet
      run: |
        source build.env

        rm -f $PWD/bin/vtgate $PWD/bin/vttablet $PWD/bin/mysqlctl $PWD/bin/mysqlctld
        cp /tmp/vitess-build-current/bin/vtgate $PWD/bin/vtgate
        cp /tmp/vitess-build-other/bin/vttablet $PWD/bin/vttablet
        cp /tmp/vitess-build-other/bin/mysqlctl $PWD/bin/mysqlctl
        cp /tmp/vitess-build-other/bin/mysqlctld $PWD/bin/mysqlctld
        vtgate --version
        vttablet --version

    # Running a test with vtgate at version n and vttablet at version n+1
    - name: Run query serving tests (vtgate=N, vttablet=N+1)
      run: |
        rm -rf /tmp/vtdataroot
        mkdir -p /tmp/vtdataroot

        source build.env
        go run test.go -skip-build -keep-data=false -docker=false -print-log -follow -tag upgrade_downgrade_query_serving_queries_2
