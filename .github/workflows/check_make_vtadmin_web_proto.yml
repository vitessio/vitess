name: check_make_vtadmin_web_proto
on:
  push:
    branches:
      - "main"
      - "release-[0-9]+.[0-9]"
    tags: '**'
  pull_request:
    branches: '**'

permissions:
  contents: read

jobs:
  # Path filtering runs here, on a small runner (a CNCF container in
  # vitess-security), so that the job below claims a VM there only when
  # something relevant changed.
  changes:
    runs-on: ${{ github.repository == 'vitessio/vitess-security' && 'cncf-c-ubuntu-2-8-x86' || 'ubuntu-24.04' }}
    timeout-minutes: 5
    outputs:
      proto_changes: ${{ steps.changes.outputs.proto_changes }}
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # The merge commit and its first parent, for the path filter.
        fetch-depth: 2
        persist-credentials: 'false'

    - name: Find the base of the pull request's merge commit
      # github.event.pull_request.base.sha is not updated when the base branch
      # moves, so paths-filter would also count the base branch's newer commits.
      # With token: '', paths-filter diffs against `base` on pull_request
      # events too (see its README); action.yml's input description is stale.
      id: merge-base
      if: github.event_name == 'pull_request'
      run: echo "sha=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"

    - name: Check for changes in relevant files
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      id: changes
      with:
        token: ''
        base: ${{ steps.merge-base.outputs.sha }}
        filters: |
          proto_changes:
            - 'bootstrap.sh'
            - 'tools/**'
            - 'build.env'
            - 'go.sum'
            - 'go.mod'
            - 'Makefile'
            - 'go/vt/proto/**'
            - 'proto/*.proto'
            - 'web/vtadmin/src/proto/**'
            - '.github/workflows/check_make_vtadmin_web_proto.yml'

  build:
    name: Check Make VTAdmin Web Proto
    needs: changes
    if: ${{ !cancelled() }}
    # When nothing relevant changed the job still runs (so its required status
    # check is reported), but on a small runner (a CNCF container in
    # vitess-security) with every step below skipped. The 'Skip CI' label also
    # gets the small runner, since the job then only fails at that step.
    # vitess-security is private, so its GitHub-hosted runners are billed and
    # smaller; it uses a CNCF VM the size of the public ubuntu-24.04 runner
    # instead.
    runs-on: ${{ github.repository == 'vitessio/vitess-security' && (needs.changes.outputs.proto_changes == 'true' && !contains(github.event.pull_request.labels.*.name, 'Skip CI') && 'cncf-ubuntu-24.04-4-16-x86' || 'cncf-c-ubuntu-2-8-x86') || 'ubuntu-24.04' }}
    steps:
    - name: Fail if the gate job failed
      # A failed gate must not turn into a silently-skipped (i.e. passing) required check.
      if: needs.changes.result != 'success'
      run: exit 1

    - name: Skip CI
      run: |
        if [[ "${{contains( github.event.pull_request.labels.*.name, 'Skip CI')}}" == "true" ]]; then
          echo "skipping CI due to the 'Skip CI' label"
          exit 1
        fi

    - name: Check out code
      if: needs.changes.outputs.proto_changes == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: 'false'

    - name: Tune the OS
      if: needs.changes.outputs.proto_changes == 'true'
      uses: $/.github/actions/tune-os

    - name: Set up Go
      uses: $/.github/actions/setup-go
      if: needs.changes.outputs.proto_changes == 'true'

    - name: Setup Node
      if: needs.changes.outputs.proto_changes == 'true'
      # zizmor: ignore[cache-poisoning] this workflow publishes no artifacts
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        # node-version should match package.json
        node-version: '22.13.1'

    - name: Install npm dependencies
      if: needs.changes.outputs.proto_changes == 'true'
      run: npm ci
      working-directory: ./web/vtadmin

    - name: check_make_vtadmin_web_proto
      if: needs.changes.outputs.proto_changes == 'true'
      run: |
        tools/check_make_vtadmin_web_proto.sh
