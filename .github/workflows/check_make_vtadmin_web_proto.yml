name: check_make_vtadmin_web_proto
on:
  push:
    branches:
      - "main"
      - "release-[0-9]+.[0-9]"
    tags: '**'
  pull_request:
    branches: '**'

permissions: read-all

jobs:
  build:
    name: Check Make VTAdmin Web Proto
    runs-on: ubuntu-24.04
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
      with:
        egress-policy: audit

    - name: Skip CI
      run: |
        if [[ "${{contains( github.event.pull_request.labels.*.name, 'Skip CI')}}" == "true" ]]; then
          echo "skipping CI due to the 'Skip CI' label"
          exit 1
        fi

    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: 'false'

    - name: Tune the OS
      timeout-minutes: 5
      uses: ./.github/actions/tune-os

    - name: Check for changes in relevant files
      uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
      id: changes
      with:
        token: ''
        filters: |
          proto_changes:
            - 'bootstrap.sh'
            - 'tools/**'
            - 'build.env'
            - 'go.sum'
            - 'go.mod'
            - 'Makefile'
            - 'go/vt/proto/**'
            - 'proto/*.proto'
            - 'web/vtadmin/src/proto/**'
            - '.github/workflows/check_make_vtadmin_web_proto.yml'
            - 'web/vtadmin/package.json'
            - 'web/vtadmin/package-lock.json'

    - name: Set up Go
      uses: ./.github/actions/setup-go
      if: steps.changes.outputs.proto_changes == 'true'

    - name: Setup Node
      if: steps.changes.outputs.proto_changes == 'true'
      # zizmor: ignore[cache-poisoning] this workflow publishes no artifacts
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        # node-version should match package.json
        node-version: '22.13.1'

    - name: Install npm dependencies
      if: steps.changes.outputs.proto_changes == 'true'
      run: npm ci
      working-directory: ./web/vtadmin

    - name: check_make_vtadmin_web_proto
      if: steps.changes.outputs.proto_changes == 'true'
      run: |
        tools/check_make_vtadmin_web_proto.sh
