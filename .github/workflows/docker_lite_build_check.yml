name: Docker Lite Build Check

on:
  pull_request:
    branches: '**'
  push:
    branches:
      - "main"
      - "release-[0-9]+.[0-9]"

concurrency:
  group: format('{0}-{1}', ${{ github.ref }}, 'Docker Lite Build Check')
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate-matrix:
    name: Generate matrix
    runs-on: ${{ github.repository == 'vitessio/vitess-security' && 'cncf-c-ubuntu-2-8-x86' || 'ubuntu-24.04' }}
    outputs:
      dockerfiles: ${{ steps.generate-matrix.outputs.dockerfiles }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'

      - name: Generate matrix
        id: generate-matrix
        run: |
          dockerfiles=$(ls docker/lite/Dockerfile* | jq -Rnc '[inputs]')
          echo "dockerfiles=${dockerfiles}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.dockerfile }}
    # vitess-security is private, so its GitHub-hosted runners are billed and
    # smaller; it uses a CNCF VM the size of the public ubuntu-24.04 runner
    # instead.
    runs-on: ${{ github.repository == 'vitessio/vitess-security' && 'cncf-ubuntu-24.04-4-16-x86' || 'ubuntu-24.04' }}
    needs: generate-matrix

    strategy:
      fail-fast: false
      matrix:
        dockerfile: ${{ fromJson(needs.generate-matrix.outputs.dockerfiles) }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Skip CI
        run: |
          if [[ "${{contains( github.event.pull_request.labels.*.name, 'Skip CI')}}" == "true" ]]; then
            echo "skipping CI due to the 'Skip CI' label"
            exit 1
          fi

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: 'false'

      - name: Find the base of the pull request's merge commit
        id: merge-base
        if: github.event_name == 'pull_request'
        run: echo "sha=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"

      - name: Check for changes in relevant files
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          token: ''
          base: ${{ steps.merge-base.outputs.sha }}
          filters: |
            docker_lite:
              - 'go/**/!(*_test).go'
              - 'go/**/*.s'
              - 'go/vt/sidecardb/**/*.sql'
              - 'go/mysql/collations/colldata/**'
              - 'go/mysql/icuregex/internal/icudata/**'
              - 'Makefile'
              - 'build.env'
              - 'go.sum'
              - 'go.mod'
              - 'tools/**'
              - 'config/**'
              - 'web/vtadmin/**'
              - 'docker/lite/**'
              - 'docker/utils/**'
              - '.dockerignore'
              - '.github/workflows/docker_lite_build_check.yml'

      - name: Build lite image
        if: steps.changes.outputs.docker_lite == 'true'
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.dockerfile }}
      cancel-in-progress: true
