name: docker_ci
on:
  push:
    branches:
      - "main"
      - "release-[0-9]+.[0-9]"
    tags: "**"
  pull_request:
    branches: "**"
concurrency:
  group: format('{0}-{1}', ${{ github.ref }}, 'docker_ci')
  cancel-in-progress: true

permissions:
  contents: read

env:
  BOOTSTRAP_VERSION: "ci"
  BOOTSTRAP_FLAVOR: "mysql84"

jobs:
  # Path filtering runs here, on a small runner (a CNCF container in
  # vitess-security), so that the job below claims a VM there only when
  # something relevant changed.
  changes:
    runs-on: ${{ github.repository == 'vitessio/vitess-security' && 'cncf-c-ubuntu-2-8-x86' || 'ubuntu-24.04' }}
    timeout-minutes: 5
    outputs:
      end_to_end: ${{ steps.changes.outputs.end_to_end }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its first parent, for the path filter.
          fetch-depth: 2
          persist-credentials: "false"

      - name: Find the base of the pull request's merge commit
        # github.event.pull_request.base.sha is not updated when the base branch
        # moves, so paths-filter would also count the base branch's newer commits.
        # With token: '', paths-filter diffs against `base` on pull_request
        # events too (see its README); action.yml's input description is stale.
        id: merge-base
        if: github.event_name == 'pull_request'
        run: echo "sha=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"

      - name: Check for changes in relevant files
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          token: ""
          base: ${{ steps.merge-base.outputs.sha }}
          filters: |
            end_to_end:
              - 'test/config.json'
              - 'go/**/!(*_test).go'
              - 'go/**/*.s'
              - 'go/test/endtoend/**'
              - 'go/vt/sidecardb/**/*.sql'
              - 'go/mysql/collations/colldata/**'
              - 'go/mysql/icuregex/internal/icudata/**'
              - 'test.go'
              - 'Makefile'
              - 'build.env'
              - 'go.sum'
              - 'go.mod'
              - 'proto/*.proto'
              - 'tools/**'
              - 'config/**'
              - 'bootstrap.sh'
              - 'docker/**'
              - 'java/**'
              - '.github/workflows/docker_ci.yml'
              - '.github/actions/build-bootstrap/**'

  build:
    name: ${{ matrix.name }}
    needs: changes
    if: ${{ !cancelled() }}
    # When nothing relevant changed the job still runs (so its required status
    # check is reported), but on a small runner (a CNCF container in
    # vitess-security) with every step below skipped. The 'Skip CI' label also
    # gets the small runner, since the job then only fails at that step.
    # vitess-security is private, so its GitHub-hosted runners are billed and
    # smaller; it uses a CNCF VM the size of the public ubuntu-24.04 runner
    # instead.
    runs-on: ${{ github.repository == 'vitessio/vitess-security' && (needs.changes.outputs.end_to_end == 'true' && !contains(github.event.pull_request.labels.*.name, 'Skip CI') && 'cncf-ubuntu-24.04-4-16-x86' || 'cncf-c-ubuntu-2-8-x86') || 'ubuntu-24.04' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: java
            name: Java Docker Test
          - shard: docker_cluster
            name: Docker Test Cluster

    steps:
      - name: Fail if the gate job failed
        # A failed gate must not turn into a silently-skipped (i.e. passing) required check.
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Skip CI
        run: |
          if [[ "${{contains( github.event.pull_request.labels.*.name, 'Skip CI')}}" == "true" ]]; then
            echo "skipping CI due to the 'Skip CI' label"
            exit 1
          fi

      - name: Check out code
        if: needs.changes.outputs.end_to_end == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"

      - name: Build bootstrap images
        if: needs.changes.outputs.end_to_end == 'true'
        timeout-minutes: 20
        uses: $/.github/actions/build-bootstrap
        with:
          bootstrap-version: ${{ env.BOOTSTRAP_VERSION }}
          bootstrap-flavor: ${{ env.BOOTSTRAP_FLAVOR }}
          cache-export: ${{ matrix.shard == 'java' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-')) }}

      - name: Set up Go
        if: needs.changes.outputs.end_to_end == 'true'
        uses: $/.github/actions/setup-go

      - name: Tune the OS
        if: needs.changes.outputs.end_to_end == 'true'
        timeout-minutes: 5
        uses: $/.github/actions/tune-os

      - name: Run docker tests - ${{ matrix.shard }}
        if: needs.changes.outputs.end_to_end == 'true'
        timeout-minutes: 30
        run: |
          go run test.go -docker=true -pull=false -flavor=${{ env.BOOTSTRAP_FLAVOR }} -bootstrap-version=${{ env.BOOTSTRAP_VERSION }} --follow -shard ${{ matrix.shard }}
