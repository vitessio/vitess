name: vtadmin-web build

# In specifying the 'paths' property, we need to include the path to this workflow .yml file. 
# See https://github.community/t/trigger-a-workflow-on-change-to-the-yml-file-itself/17792/4)
on:
  push:
    branches:
      - "main"
      - "release-[0-9]+.[0-9]"
    tags: '**'
    paths:
      - '.github/workflows/vtadmin_web_build.yml'
      - 'web/vtadmin/**'
  pull_request:
    branches: '**'
    paths:
      - '.github/workflows/vtadmin_web_build.yml'
      - 'web/vtadmin/**'

permissions: read-all

jobs:
  build:
    # vitess-security is private, so its GitHub-hosted runners are billed and
    # smaller; it uses a CNCF VM the size of the public ubuntu-24.04 runner
    # instead.
    runs-on: ${{ github.repository == 'vitessio/vitess-security' && 'cncf-ubuntu-24.04-4-16-x86' || 'ubuntu-24.04' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Skip CI
        run: |
          if [[ "${{contains( github.event.pull_request.labels.*.name, 'Skip CI')}}" == "true" ]]; then
            echo "skipping CI due to the 'Skip CI' label"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'

      - name: Tune the OS
        timeout-minutes: 5
        uses: $/.github/actions/tune-os

      - name: Setup Node
        # zizmor: ignore[cache-poisoning] this workflow publishes no artifacts
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # node-version should match package.json
          node-version: '24.21.0'

      - name: Install dependencies
        timeout-minutes: 5
        run: cd ./web/vtadmin && npm ci

      - name: Build front-end
        run: cd ./web/vtadmin && npm run build

    # Cancel pending and in-progress runs of this workflow if a newer ref is pushed to CI.
    concurrency: 
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
