name: Code Freeze
on:
  pull_request:

permissions: read-all

jobs:
  build:
    name: Code Freeze
    # Skip the other vitessio repositories, such as vitess-security.
    if: github.repository_owner != 'vitessio' || github.repository == 'vitessio/vitess'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Fail if Code Freeze is enabled
      run: |
        exit 0
