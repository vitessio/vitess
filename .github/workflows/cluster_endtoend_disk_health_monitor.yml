name: Cluster End-to-End Tests (tabletmanager_disk_health_monitor)

on:
  push:
    branches:
      - "main"
      - "release-[0-9]+.[0-9]"
    tags: "**"
  pull_request:
    branches: "**"

concurrency:
  group: format('{0}-{1}', ${{ github.ref }}, 'Cluster End-to-End Tests (tabletmanager_disk_health_monitor)')
  cancel-in-progress: true

permissions:
  contents: read

env:
  LAUNCHABLE_ORGANIZATION: "vitess"
  LAUNCHABLE_WORKSPACE: "vitess-app"
  GITHUB_PR_HEAD_SHA: "${{ github.event.pull_request.head.sha }}"

jobs:
  # Path filtering runs here, on a small runner (a CNCF container in
  # vitess-security), so that the job below claims a VM there only when
  # something relevant changed.
  changes:
    runs-on: ${{ github.repository == 'vitessio/vitess-security' && 'cncf-c-ubuntu-2-8-x86' || 'ubuntu-24.04' }}
    timeout-minutes: 5
    outputs:
      end_to_end: ${{ steps.changes.outputs.end_to_end }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its first parent, for the path filter.
          fetch-depth: 2
          persist-credentials: "false"

      - name: Find the commit to diff against
        id: diff-base
        uses: $/.github/actions/diff-base

      - name: Check for changes in relevant files
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          token: ""
          base: ${{ steps.diff-base.outputs.sha }}
          filters: |
            end_to_end:
              - 'go/vt/vttablet/tabletserver/**'
              - 'go/test/endtoend/cluster/**'
              - 'go/test/endtoend/tabletmanager/disk_health_monitor/**'
              - 'test/config.json'
              - 'test.go'
              - 'Makefile'
              - 'build.env'
              - 'go.sum'
              - 'go.mod'
              - 'tools/**'
              - 'config/**'
              - 'bootstrap.sh'
              - '.github/workflows/cluster_endtoend_disk_health_monitor.yml'
              - '.github/actions/setup-mysql/action.yml'
              - '.github/actions/tune-os/**'
              - '.github/actions/setup-go/action.yml'

  test:
    name: Run endtoend tests on Cluster (tabletmanager_disk_health_monitor)
    needs: changes
    if: ${{ !cancelled() }}
    # When nothing relevant changed the job still runs (so its required status
    # check is reported), but on a small runner (a CNCF container in
    # vitess-security) with every step below skipped. The 'Skip CI' label also
    # gets the small runner, since the job then only fails at that step.
    # vitess-security is private, so its GitHub-hosted runners are billed and
    # smaller; it uses a CNCF VM the size of the public ubuntu-24.04 runner
    # instead.
    runs-on: ${{ github.repository == 'vitessio/vitess-security' && (needs.changes.outputs.end_to_end == 'true' && !contains(github.event.pull_request.labels.*.name, 'Skip CI') && 'cncf-ubuntu-24.04-4-16-x86' || 'cncf-c-ubuntu-2-8-x86') || 'ubuntu-24.04' }}
    timeout-minutes: 60

    steps:
      - name: Fail if the gate job failed
        # A failed gate must not turn into a silently-skipped (i.e. passing) required check.
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Skip CI
        run: |
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'Skip CI') }}" == "true" ]]; then
            echo "skipping CI due to the 'Skip CI' label"
            exit 1
          fi

      - name: Check out code
        if: needs.changes.outputs.end_to_end == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"

      - name: Set up Go
        if: needs.changes.outputs.end_to_end == 'true'
        uses: $/.github/actions/setup-go

      - name: Set up python
        if: needs.changes.outputs.end_to_end == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0

      - name: Tune the OS
        if: needs.changes.outputs.end_to_end == 'true'
        timeout-minutes: 5
        uses: $/.github/actions/tune-os

      - name: Setup MySQL
        if: needs.changes.outputs.end_to_end == 'true'
        timeout-minutes: 8
        uses: $/.github/actions/setup-mysql
        with:
          flavor: mysql-8.4

      - name: Get dependencies
        if: needs.changes.outputs.end_to_end == 'true'
        timeout-minutes: 10
        run: |
          sudo apt-get -qq install -y mysql-shell
          sudo apt-get -qq install -y make unzip g++ etcd-client etcd-server curl git wget xz-utils libncurses6 fuse3
          sudo service etcd stop

      - name: Setup launchable dependencies
        if: |
          github.event_name == 'pull_request' &&
          github.event.pull_request.draft == false &&
          needs.changes.outputs.end_to_end == 'true' &&
          github.base_ref == 'main'
        run: |
          pip3 install --user launchable~=1.0 > /dev/null
          launchable verify || true
          launchable record build --name "$GITHUB_RUN_ID" --no-commit-collection --source .

      - name: Run cluster endtoend test
        if: needs.changes.outputs.end_to_end == 'true'
        timeout-minutes: 45
        run: |
          export VTDATAROOT="/tmp/"
          source build.env
          set -exo pipefail

          go run test.go -docker=false -follow -shard tabletmanager_disk_health_monitor

      - name: Record test results in launchable
        if: |
          github.event_name == 'pull_request' &&
          github.event.pull_request.draft == false &&
          needs.changes.outputs.end_to_end == 'true' &&
          github.base_ref == 'main' &&
          !cancelled()
        run: |
          launchable record tests --build "$GITHUB_RUN_ID" go-test . || true

      - name: Test Summary
        if: needs.changes.outputs.end_to_end == 'true' && failure()
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        with:
          paths: "_test/junit/*.xml"
