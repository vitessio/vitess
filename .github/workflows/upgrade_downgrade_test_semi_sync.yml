name: Semi Sync Upgrade Downgrade Testing
on:
  push:
    branches:
      - "main"
      - "release-[0-9]+.[0-9]"
    tags: '**'
  pull_request:
    branches: '**'

concurrency:
  group: format('{0}-{1}', ${{ github.ref }}, 'Semi Sync Upgrade Downgrade Testing')
  cancel-in-progress: true

permissions: read-all

jobs:
  upgrade_downgrade_test_e2e:
    timeout-minutes: 60
    name: Run Semi Sync Upgrade Downgrade Test
    runs-on: ${{ github.repository_owner == 'vitessio' && 'cncf-ubuntu-24.04-16-64-x86' || github.repository == 'vitessio/vitess-security' && 'cncf-c-ubuntu-2-8-x86' || 'ubuntu-24.04' }}

    steps:
      - name: Skip CI
        run: |
          if [[ "${{contains( github.event.pull_request.labels.*.name, 'Skip CI')}}" == "true" ]]; then
            echo "skipping CI due to the 'Skip CI' label"
            exit 1
          fi

      - name: Check out commit's code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: 'false'

      - name: Find the base of the pull request's merge commit
        # github.event.pull_request.base.sha is not updated when the base branch
        # moves, so paths-filter would also count the base branch's newer commits.
        # With token: '', paths-filter diffs against `base` on pull_request
        # events too (see its README); action.yml's input description is stale.
        id: merge-base
        if: github.event_name == 'pull_request'
        run: echo "sha=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"

      - name: Check for changes in relevant files
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          token: ''
          base: ${{ steps.merge-base.outputs.sha }}
          filters: |
            end_to_end:
              - 'test/config.json'
              - 'go/**'
              - 'go/**/*.go'
              - 'test.go'
              - 'Makefile'
              - 'build.env'
              - 'go.sum'
              - 'go.mod'
              - 'proto/*.proto'
              - 'tools/**'
              - 'config/**'
              - 'bootstrap.sh'
              - '.github/workflows/upgrade_downgrade_test_semi_sync.yml'

      - name: Set output with latest release branch
        id: output-previous-release-ref
        if: steps.changes.outputs.end_to_end == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
          REF: ${{ github.ref }}
        run: |
          previous_release_ref=$(./tools/get_previous_release.sh "$BASE_REF" "$REF")
          echo $previous_release_ref
          echo "previous_release_ref=${previous_release_ref}" >> $GITHUB_OUTPUT

      - name: Tune the OS
        if: steps.changes.outputs.end_to_end == 'true'
        uses: $/.github/actions/tune-os

      - name: Set up python
        if: steps.changes.outputs.end_to_end == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0

      - name: Setup MySQL
        if: steps.changes.outputs.end_to_end == 'true'
        uses: $/.github/actions/setup-mysql
        with:
          flavor: mysql-8.4

      - name: Get base dependencies
        timeout-minutes: 10
        if: steps.changes.outputs.end_to_end == 'true'
        run: |
          sudo DEBIAN_FRONTEND="noninteractive" apt-get update

          # Install everything else we need, and configure
          sudo apt-get install -y make unzip g++ etcd-client etcd-server curl git wget grep

          sudo service etcd stop
          
          wget https://repo.percona.com/apt/percona-release_latest.$(lsb_release -sc)_all.deb
          sudo apt-get install -y gnupg2 lz4
          sudo dpkg -i percona-release_latest.$(lsb_release -sc)_all.deb
          sudo percona-release enable tools
          sudo percona-release setup pxb-80
          sudo apt-get update
          sudo apt-get install -y percona-xtrabackup-80

      # Checkout to the last release of Vitess
      - name: Check out other version's code (${{ steps.output-previous-release-ref.outputs.previous_release_ref }})
        if: steps.changes.outputs.end_to_end == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.output-previous-release-ref.outputs.previous_release_ref }}
          persist-credentials: 'false'

      - name: Set up Go
        if: steps.changes.outputs.end_to_end == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Get dependencies for the last release
        if: steps.changes.outputs.end_to_end == 'true'
        run: |
          go mod download

      - name: Building last release's binaries
        if: steps.changes.outputs.end_to_end == 'true'
        timeout-minutes: 10
        run: |
          source build.env
          NOVTADMINBUILD=1 make build
          mkdir -p /tmp/vitess-build-other/
          cp -R bin /tmp/vitess-build-other/
          rm -Rf bin/*

      # Checkout to this build's commit
      - name: Check out commit's code
        if: steps.changes.outputs.end_to_end == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'

      - name: Set up Go
        if: steps.changes.outputs.end_to_end == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Get dependencies for this commit
        if: steps.changes.outputs.end_to_end == 'true'
        run: |
          go mod download

      - name: Building the binaries for this commit
        if: steps.changes.outputs.end_to_end == 'true'
        timeout-minutes: 10
        run: |
          source build.env
          NOVTADMINBUILD=1 make build
          mkdir -p /tmp/vitess-build-current/
          cp -R bin /tmp/vitess-build-current/

      # Copy last releases vttablet
      - name: Copy last release's VTTablet
        if: steps.changes.outputs.end_to_end == 'true'
        run: |
          source build.env
          
          cp /tmp/vitess-build-other/bin/vttablet $PWD/bin/vttabletold
          vttabletold --version

      - name: Run semi sync tests
        if: steps.changes.outputs.end_to_end == 'true'
        run: |
          rm -rf /tmp/vtdataroot
          mkdir -p /tmp/vtdataroot
          # Keep the path of the mysql.sock file short: under the checkout it can exceed the 107-character limit for a Unix socket path.
          export VTDATAROOT=/tmp/vtdataroot
          set -x
          source build.env
          go test -v -count=1 -run="" ./go/test/endtoend/reparent/semisync -alsologtostderr
