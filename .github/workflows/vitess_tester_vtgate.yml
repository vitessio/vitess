name: Vitess Tester (vtgate)
on:
  push:
    branches:
      - "main"
      - "release-[0-9]+.[0-9]"
    tags: '**'
  pull_request:
    branches: '**'
concurrency:
  group: format('{0}-{1}', ${{ github.ref }}, 'Vitess Tester (vtgate)')
  cancel-in-progress: true

permissions:
  contents: read

env:
  LAUNCHABLE_ORGANIZATION: "vitess"
  LAUNCHABLE_WORKSPACE: "vitess-app"
  GITHUB_PR_HEAD_SHA: "${{ github.event.pull_request.head.sha }}"

jobs:
  # Path filtering runs here, on a small runner (a CNCF container in
  # vitess-security), so that the job below claims a VM there only when
  # something relevant changed.
  changes:
    runs-on: ${{ github.repository == 'vitessio/vitess-security' && 'cncf-c-ubuntu-2-8-x86' || 'ubuntu-24.04' }}
    timeout-minutes: 5
    outputs:
      end_to_end: ${{ steps.changes.outputs.end_to_end }}
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # The merge commit and its first parent, for the path filter.
        fetch-depth: 2
        persist-credentials: 'false'

    - name: Find the base of the pull request's merge commit
      # github.event.pull_request.base.sha is not updated when the base branch
      # moves, so paths-filter would also count the base branch's newer commits.
      # With token: '', paths-filter diffs against `base` on pull_request
      # events too (see its README); action.yml's input description is stale.
      id: merge-base
      if: github.event_name == 'pull_request'
      run: echo "sha=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"

    - name: Check for changes in relevant files
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      id: changes
      with:
        token: ''
        base: ${{ steps.merge-base.outputs.sha }}
        filters: |
          end_to_end:
            - 'test/config.json'
            - 'go/**/*.go'
            - 'go/vt/sidecardb/**/*.sql'
            - 'go/test/endtoend/vtgate/vitess_tester/**'
            - 'test.go'
            - 'Makefile'
            - 'build.env'
            - 'go.sum'
            - 'go.mod'
            - 'proto/*.proto'
            - 'tools/**'
            - 'config/**'
            - 'bootstrap.sh'
            - '.github/workflows/vitess_tester_vtgate.yml'
            - '.github/actions/setup-mysql/action.yml'
            - '.github/actions/tune-os/**'
            - '.github/actions/setup-go/action.yml'

  build:
    name: Run endtoend tests on Vitess Tester (vtgate)
    needs: changes
    if: ${{ !cancelled() }}
    # When nothing relevant changed the job still runs (so its required status
    # check is reported), but on a small runner (a CNCF container in
    # vitess-security) with every step below skipped. The 'Skip CI' label also
    # gets the small runner, since the job then only fails at that step.
    # vitess-security is private, so its GitHub-hosted runners are billed and
    # smaller; it uses a CNCF VM the size of the public ubuntu-24.04 runner
    # instead.
    runs-on: ${{ github.repository == 'vitessio/vitess-security' && (needs.changes.outputs.end_to_end == 'true' && !contains(github.event.pull_request.labels.*.name, 'Skip CI') && 'cncf-ubuntu-24.04-4-16-x86' || 'cncf-c-ubuntu-2-8-x86') || 'ubuntu-24.04' }}

    steps:
    - name: Fail if the gate job failed
      # A failed gate must not turn into a silently-skipped (i.e. passing) required check.
      if: needs.changes.result != 'success'
      run: exit 1

    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - name: Skip CI
      run: |
        if [[ "${{contains( github.event.pull_request.labels.*.name, 'Skip CI')}}" == "true" ]]; then
          echo "skipping CI due to the 'Skip CI' label"
          exit 1
        fi

    - name: Check out code
      if: needs.changes.outputs.end_to_end == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: 'false'

    - name: Set up Go
      if: needs.changes.outputs.end_to_end == 'true'
      uses: $/.github/actions/setup-go

    - name: Set up python
      if: needs.changes.outputs.end_to_end == 'true'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0

    - name: Tune the OS
      if: needs.changes.outputs.end_to_end == 'true'
      uses: $/.github/actions/tune-os

    - name: Setup MySQL
      if: needs.changes.outputs.end_to_end == 'true'
      uses: $/.github/actions/setup-mysql
      with:
        flavor: mysql-8.4

    - name: Get dependencies
      if: needs.changes.outputs.end_to_end == 'true'
      run: |
        sudo apt-get -qq update

        # Install everything else we need, and configure
        sudo apt-get -qq install -y make unzip g++ etcd-client etcd-server curl git wget xz-utils libncurses6

        sudo service etcd stop

        # install JUnit report formatter
        go install github.com/vitessio/go-junit-report@99fa7f0daf16db969f54a49139a14471e633e6e8 # HEAD
        
        # install vitess tester
        go install github.com/vitessio/vt/go/vt@e43009309f599378504905d4b804460f47822ac5

    - name: Setup launchable dependencies
      if: github.event_name == 'pull_request' && github.event.pull_request.draft == 'false' && needs.changes.outputs.end_to_end == 'true' && github.base_ref == 'main'
      run: |
        # Get Launchable CLI installed. If you can, make it a part of the builder image to speed things up
        pip3 install --user launchable~=1.0 > /dev/null

        # verify that launchable setup is all correct.
        launchable verify || true

        # Tell Launchable about the build you are producing and testing
        launchable record build --name "$GITHUB_RUN_ID" --no-commit-collection --source .

    - name: Run cluster endtoend test
      if: needs.changes.outputs.end_to_end == 'true'
      timeout-minutes: 45
      run: |
        # We set the VTDATAROOT to the /tmp folder to reduce the file path of mysql.sock file
        # which musn't be more than 107 characters long.
        export VTDATAROOT="/tmp/"
        source build.env
        export NOVTADMINBUILD=1
        make build

        set -exo pipefail

        i=1
        for dir in ./go/test/endtoend/vtgate/vitess_tester/*/; do 
          # We go over all the directories in the given path.
          # If there is a vschema file there, we use it, otherwise we let vt tester autogenerate it.
          if [ -f $dir/vschema.json ]; then
            vt tester --xunit --vschema "$dir"vschema.json $dir/*.test
          else 
            vt tester --sharded --xunit $dir/*.test
          fi
          # Number the reports by changing their file names.
          mv report.xml report"$i".xml
          i=$((i+1))
        done

    - name: Record test results in launchable if PR is not a draft
      if: github.event_name == 'pull_request' && github.event.pull_request.draft == 'false' && needs.changes.outputs.end_to_end == 'true' && github.base_ref == 'main' && !cancelled()
      run: |
        # send recorded tests to launchable
        launchable record tests --build "$GITHUB_RUN_ID" go-test . || true

    - name: Print test output
      if: needs.changes.outputs.end_to_end == 'true' && !cancelled()
      run: |
        # print test output
        cat report*.xml

    - name: Test Summary
      if: needs.changes.outputs.end_to_end == 'true' && !cancelled()
      uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
      with:
        paths: "report*.xml"
        show: "fail"
