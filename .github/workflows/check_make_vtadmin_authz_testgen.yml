name: check_make_vtadmin_authz_testgen
on:
  push:
    branches:
      - "main"
      - "release-[0-9]+.[0-9]"
    tags: '**'
  pull_request:
    branches: '**'

permissions: read-all

jobs:
  build:
    name: Check Make vtadmin_authz_testgen
    runs-on: ubuntu-24.04
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
      with:
        egress-policy: audit

    - name: Skip CI
      run: |
        if [[ "${{contains( github.event.pull_request.labels.*.name, 'Skip CI')}}" == "true" ]]; then
          echo "skipping CI due to the 'Skip CI' label"
          exit 1
        fi

    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: 'false'

    - name: Check for changes in relevant files
      uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
      id: changes
      with:
        token: ''
        filters: |
          vtadmin_changes:
            - 'bootstrap.sh'
            - 'tools/**'
            - 'build.env'
            - 'go.sum'
            - 'go.mod'
            - 'Makefile'
            - 'go/vt/vtadmin/**'
            - '.github/workflows/check_make_vtadmin_authz_testgen.yml'

    - name: Tune the OS
      if: steps.changes.outputs.vtadmin_changes == 'true'
      timeout-minutes: 5
      uses: ./.github/actions/tune-os

    - name: Set up Go
      uses: ./.github/actions/setup-go
      if: steps.changes.outputs.vtadmin_changes == 'true'

    - name: Get dependencies
      if: steps.changes.outputs.vtadmin_changes == 'true'
      timeout-minutes: 5
      run: |
        sudo apt-get update
        sudo apt-get install -y make unzip g++ etcd-client etcd-server curl git wget
        sudo service etcd stop
        go mod download

    - name: Run make minimaltools
      if: steps.changes.outputs.vtadmin_changes == 'true'
      timeout-minutes: 5
      run: |
        make minimaltools

    - name: check_make_vtadmin_authz_testgen
      if: steps.changes.outputs.vtadmin_changes == 'true'
      run: |
        tools/check_make_vtadmin_authz_testgen.sh
