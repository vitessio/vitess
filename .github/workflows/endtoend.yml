name: endtoend
on:
  push:
    branches:
      - "main"
      - "release-[0-9]+.[0-9]"
    tags: '**'
  pull_request:
    branches: '**'
concurrency:
  group: format('{0}-{1}', ${{ github.ref }}, 'endtoend')
  cancel-in-progress: true

permissions: read-all
jobs:

  build:
    name: End-to-End Test
    runs-on: ubuntu-24.04
    steps:
    - name: Skip CI
      run: |
        if [[ "${{contains( github.event.pull_request.labels.*.name, 'Skip CI')}}" == "true" ]]; then
          echo "skipping CI due to the 'Skip CI' label"
          exit 1
        fi

    - name: Check out code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        # The merge commit and its first parent, for the path filter.
        fetch-depth: 2
        persist-credentials: 'false'

    - name: Find the base of the pull request's merge commit
      # github.event.pull_request.base.sha is not updated when the base branch
      # moves, so paths-filter would also count the base branch's newer commits.
      # With token: '', paths-filter diffs against `base` on pull_request
      # events too (see its README); action.yml's input description is stale.
      id: merge-base
      if: github.event_name == 'pull_request'
      run: echo "sha=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"

    - name: Check for changes in relevant files
      uses: dorny/paths-filter@ebc4d7e9ebcb0b1eb21480bb8f43113e996ac77a # v3.0.1
      id: changes
      with:
        token: ''
        base: ${{ steps.merge-base.outputs.sha }}
        filters: |
          end_to_end:
            - 'go/**/*.go'
            - 'test.go'
            - 'Makefile'
            - 'build.env'
            - 'go.sum'
            - 'go.mod'
            - 'proto/*.proto'
            - 'tools/**'
            - 'config/**'
            - 'bootstrap.sh'
            - '.github/workflows/endtoend.yml'
            - '.github/actions/setup-mysql/action.yml'
            - '.github/actions/setup-go/action.yml'

    - name: Set up Go
      if: steps.changes.outputs.end_to_end == 'true'
      # zizmor: ignore[cache-poisoning] this workflow publishes no artifacts
      uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
      with:
        go-version-file: go.mod
        cache: ${{ (github.base_ref == 'main' || (github.base_ref == '' && github.ref_name == 'main')) && 'true' || 'false' }}

    - name: Tune the OS
      if: steps.changes.outputs.end_to_end == 'true'
      uses: $/.github/actions/tune-os

    - name: Setup MySQL
      if: steps.changes.outputs.end_to_end == 'true'
      uses: $/.github/actions/setup-mysql
      with:
        flavor: mysql-8.0

    - name: Get dependencies
      if: steps.changes.outputs.end_to_end == 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y make unzip g++ etcd-client etcd-server curl git wget
        
        sudo service etcd stop

    - name: Run make minimaltools
      if: steps.changes.outputs.end_to_end == 'true'
      run: |
        make minimaltools

    - name: Build
      if: steps.changes.outputs.end_to_end == 'true'
      run: |
        NOVTADMINBUILD=1 make build

    - name: endtoend
      if: steps.changes.outputs.end_to_end == 'true'
      timeout-minutes: 30
      run: |
        # We set the VTDATAROOT to the /tmp folder to reduce the file path of mysql.sock file
        # which musn't be more than 107 characters long.
        export VTDATAROOT="/tmp/"

        tools/e2e_test_runner.sh
