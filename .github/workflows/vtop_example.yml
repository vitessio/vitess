name: vtop_example

permissions:
  contents: read

on:
  push:
    branches:
      - "main"
      - "release-[0-9]+.[0-9]"
    tags: "**"
  pull_request:
    branches: "**"
concurrency:
  group: format('{0}-{1}', ${{ github.ref }}, 'vtop_example')
  cancel-in-progress: true

jobs:
  # Path filtering runs once here, on a GitHub-hosted runner, so that the
  # job below (on a large runner) is not started at all when nothing relevant
  # changed.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      end_to_end: ${{ steps.changes.outputs.end_to_end }}
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: "false"

      - name: Check for changes in relevant files
        uses: dorny/paths-filter@ebc4d7e9ebcb0b1eb21480bb8f43113e996ac77a # v3.0.1
        id: changes
        with:
          token: ""
          filters: |
            end_to_end:
              - 'go/**/*.go'
              - 'go/vt/sidecardb/**/*.sql'
              - 'test.go'
              - 'Makefile'
              - 'build.env'
              - 'go.[sumod]'
              - 'proto/*.proto'
              - 'tools/**'
              - 'config/**'
              - 'bootstrap.sh'
              - 'examples/**'
              - 'test/**'
              - '.github/workflows/vtop_example.yml'
              - '.github/actions/setup-mysql/action.yml'
              - '.github/actions/setup-go/action.yml'

  build:
    needs: changes
    # Runs when the gate found relevant changes. Also runs when the gate did not
    # succeed (it failed, or was cancelled by its timeout) or the PR has the
    # 'Skip CI' label, so that those fail this job instead of silently skipping
    # a required status check.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || contains(github.event.pull_request.labels.*.name, 'Skip CI') || (needs.changes.outputs.end_to_end == 'true')) }}
    name: VTop Example
    # The large runner is only claimed when the tests will actually run; a
    # failed or cancelled gate and the 'Skip CI' label only report a failure.
    runs-on: ${{ needs.changes.result == 'success' && needs.changes.outputs.end_to_end == 'true' && !contains(github.event.pull_request.labels.*.name, 'Skip CI') && github.repository == 'vitessio/vitess' && 'oracle-vm-8cpu-32gb-x86-64' || 'ubuntu-24.04' }}

    steps:
      - name: Skip CI
        run: |
          if [[ "${{contains( github.event.pull_request.labels.*.name, 'Skip CI')}}" == "true" ]]; then
            echo "skipping CI due to the 'Skip CI' label"
            exit 1
          fi

      - name: Fail if the gate job failed
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: "false"

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: ${{ (github.base_ref == 'main' || (github.base_ref == '' && github.ref_name == 'main')) && 'true' || 'false' }}

      - name: Tune the OS
        uses: $/.github/actions/tune-os

      - name: Setup MySQL
        uses: $/.github/actions/setup-mysql
        with:
          flavor: mysql-8.4

      - name: Get dependencies
        run: |
          # Install everything we need, and configure
          sudo apt-get install -y make

      # needed for vtctldclient
      - name: Build vitess
        run: |
          make build

      - name: Install kubectl & kind
        run: |
          make install_kubectl_kind

      - name: vtop_example
        timeout-minutes: 60
        run: |
          source build.env
          go run test.go -docker=false -skip-build -print-log -follow -timeout=60m vtop_example
