name: vtop_example

permissions: read-all

on:
  push:
    branches:
      - "main"
      - "release-[0-9]+.[0-9]"
    tags: "**"
  pull_request:
    branches: "**"
concurrency:
  group: format('{0}-{1}', ${{ github.ref }}, 'vtop_example')
  cancel-in-progress: true

jobs:
  build:
    name: VTop Example
    runs-on: ${{ github.repository == 'vitessio/vitess' && 'oracle-vm-8cpu-32gb-x86-64' || 'ubuntu-24.04' }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Skip CI
        run: |
          if [[ "${{contains( github.event.pull_request.labels.*.name, 'Skip CI')}}" == "true" ]]; then
            echo "skipping CI due to the 'Skip CI' label"
            exit 1
          fi

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"

      - name: Check for changes in relevant files
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: changes
        with:
          token: ""
          filters: |
            end_to_end:
              - 'go/**/!(*_test).go'
              - 'go/**/*.s'
              - 'go/vt/sidecardb/**/*.sql'
              - 'go/mysql/collations/colldata/**'
              - 'go/mysql/icuregex/internal/icudata/**'
              - 'test.go'
              - 'Makefile'
              - 'build.env'
              - 'go.[sumod]'
              - 'proto/*.proto'
              - 'tools/**'
              - 'config/**'
              - 'bootstrap.sh'
              - 'examples/**'
              - 'test/**'
              - '.github/workflows/vtop_example.yml'
              - '.github/actions/setup-mysql/action.yml'

      - name: Set up Go
        if: steps.changes.outputs.end_to_end == 'true'
        uses: ./.github/actions/setup-go

      - name: Tune the OS
        if: steps.changes.outputs.end_to_end == 'true'
        timeout-minutes: 5
        uses: ./.github/actions/tune-os

      - name: Setup MySQL
        if: steps.changes.outputs.end_to_end == 'true'
        timeout-minutes: 8
        uses: ./.github/actions/setup-mysql
        with:
          flavor: mysql-8.4

      - name: Get dependencies
        if: steps.changes.outputs.end_to_end == 'true'
        timeout-minutes: 5
        run: |
          # Install everything we need, and configure
          sudo apt-get install -y make
          go mod download

      # needed for vtctldclient
      - name: Build vitess
        if: steps.changes.outputs.end_to_end == 'true'
        timeout-minutes: 10
        run: |
          make build

      - name: Install kubectl & kind
        if: steps.changes.outputs.end_to_end == 'true'
        timeout-minutes: 5
        run: |
          make install_kubectl_kind

      - name: vtop_example
        if: steps.changes.outputs.end_to_end == 'true'
        timeout-minutes: 60
        run: |
          source build.env
          go run test.go -docker=false -skip-build -print-log -follow -timeout=60m vtop_example
