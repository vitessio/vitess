name: vtop_example

permissions:
  contents: read

on:
  push:
    branches:
      - "main"
      - "release-[0-9]+.[0-9]"
    tags: "**"
  pull_request:
    branches: "**"
concurrency:
  group: format('{0}-{1}', ${{ github.ref }}, 'vtop_example')
  cancel-in-progress: true

jobs:
  # Path filtering runs once here, on a GitHub-hosted runner, so that the
  # job below (on a large runner) is not started at all when nothing relevant
  # changed.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      end_to_end: ${{ steps.changes.outputs.end_to_end }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"

      - name: Check for changes in relevant files
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          token: ""
          filters: |
            end_to_end:
              - 'go/**/!(*_test).go'
              - 'go/**/*.s'
              - 'go/vt/sidecardb/**/*.sql'
              - 'go/mysql/collations/colldata/**'
              - 'go/mysql/icuregex/internal/icudata/**'
              - 'test.go'
              - 'Makefile'
              - 'build.env'
              - 'go.[sumod]'
              - 'proto/*.proto'
              - 'tools/**'
              - 'config/**'
              - 'bootstrap.sh'
              - 'examples/**'
              - 'test/**'
              - '.github/workflows/vtop_example.yml'
              - '.github/actions/setup-mysql/action.yml'

  build:
    needs: changes
    # Runs when the gate found relevant changes, and also when the gate itself
    # failed, so that failure is reported instead of silently skipping a
    # required status check.
    if: ${{ !cancelled() && (needs.changes.result == 'failure' || (needs.changes.outputs.end_to_end == 'true')) }}
    name: VTop Example
    runs-on: ${{ github.repository == 'vitessio/vitess' && 'oracle-vm-8cpu-32gb-x86-64' || 'ubuntu-24.04' }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Skip CI
        run: |
          if [[ "${{contains( github.event.pull_request.labels.*.name, 'Skip CI')}}" == "true" ]]; then
            echo "skipping CI due to the 'Skip CI' label"
            exit 1
          fi

      - name: Fail if the gate job failed
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"

      - name: Set up Go
        uses: $/.github/actions/setup-go

      - name: Tune the OS
        timeout-minutes: 5
        uses: $/.github/actions/tune-os

      - name: Setup MySQL
        timeout-minutes: 8
        uses: $/.github/actions/setup-mysql
        with:
          flavor: mysql-8.4

      - name: Get dependencies
        timeout-minutes: 5
        run: |
          # Install everything we need, and configure
          sudo apt-get install -y make

      # needed for vtctldclient
      - name: Build vitess
        timeout-minutes: 10
        run: |
          make build

      - name: Install kubectl & kind
        timeout-minutes: 5
        run: |
          make install_kubectl_kind

      - name: vtop_example
        timeout-minutes: 60
        run: |
          source build.env
          go run test.go -docker=false -skip-build -print-log -follow -timeout=60m vtop_example
