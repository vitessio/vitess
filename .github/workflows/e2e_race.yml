name: e2e_race
on:
  push:
    branches:
      - "main"
      - "release-[0-9]+.[0-9]"
    tags: '**'
  pull_request:
    branches: '**'
permissions: read-all
jobs:

  build:
    name: End-to-End Test (Race)
    runs-on: ubuntu-24.04
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - name: Skip CI
      run: |
        if [[ "${{contains( github.event.pull_request.labels.*.name, 'Skip CI')}}" == "true" ]]; then
          echo "skipping CI due to the 'Skip CI' label"
          exit 1
        fi

    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: 'false'

    - name: Check for changes in relevant files
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      id: changes
      with:
        token: ''
        filters: |
          end_to_end:
            - 'go/**/!(*_test).go'
            - 'go/**/*.s'
            # Package-level endtoend suites (go/mysql/endtoend, go/vt/vtgate/endtoend, ...).
            # The cluster test tree go/test/endtoend is excluded: its packages are not run
            # here, and its non-test .go helpers already match the first pattern.
            - 'go/!(test)/**/endtoend/**'
            - 'go/vt/sidecardb/**/*.sql'
            - 'go/mysql/collations/colldata/**'
            - 'go/mysql/icuregex/internal/icudata/**'
            - 'test.go'
            - 'Makefile'
            - 'build.env'
            - 'go.sum'
            - 'go.mod'
            - 'proto/*.proto'
            - 'tools/**'
            - 'config/**'
            - 'bootstrap.sh'
            - '.github/workflows/e2e_race.yml'
            - '.github/actions/setup-mysql/action.yml'

    - name: Set up Go
      if: steps.changes.outputs.end_to_end == 'true'
      uses: ./.github/actions/setup-go

    - name: Tune the OS
      if: steps.changes.outputs.end_to_end == 'true'
      timeout-minutes: 5
      uses: ./.github/actions/tune-os

    - name: Setup MySQL
      if: steps.changes.outputs.end_to_end == 'true'
      timeout-minutes: 8
      uses: ./.github/actions/setup-mysql
      with:
        flavor: mysql-8.4

    - name: Get dependencies
      if: steps.changes.outputs.end_to_end == 'true'
      timeout-minutes: 5
      run: |
        sudo apt-get update
        
        # Install everything else we need, and configure
        sudo apt-get install -y make unzip g++ etcd-client etcd-server curl git wget xz-utils
        
        sudo service etcd stop

        go mod download

    - name: Run make minimaltools
      if: steps.changes.outputs.end_to_end == 'true'
      timeout-minutes: 5
      run: |
        make minimaltools

    - name: e2e_race
      if: steps.changes.outputs.end_to_end == 'true'
      timeout-minutes: 30
      run: |
        NOVTADMINBUILD=1 make e2e_test_race
