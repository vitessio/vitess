name: Unit Test

on:
  push:
    branches:
      - "main"
      - "release-[0-9]+.[0-9]"
    tags: "**"
  pull_request:
    branches: "**"

concurrency:
  group: format('{0}-{1}', ${{ github.ref }}, 'Unit Test')
  cancel-in-progress: true

permissions:
  contents: read

env:
  LAUNCHABLE_ORGANIZATION: "vitess"
  LAUNCHABLE_WORKSPACE: "vitess-app"
  GITHUB_PR_HEAD_SHA: "${{ github.event.pull_request.head.sha }}"

jobs:
  # Path filtering runs once here, on a GitHub-hosted runner, so that the
  # matrix jobs below (on large runners) are not started at all when nothing
  # relevant changed.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      unit_tests: ${{ steps.changes.outputs.unit_tests }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"

      - name: Check for changes in relevant files
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          token: ""
          # With 'every', a file is relevant only if it matches all patterns: any
          # path from the brace-list, and not a test file in one of the endtoend
          # test packages, which the unit test runner never runs and which cannot
          # be imported by unit tests. The endtoend trees are enumerated explicitly
          # so that testdata fixtures whose paths merely contain an endtoend
          # directory (e.g. under go/tools/ci-config) still count as relevant.
          predicate-quantifier: 'every'
          filters: |
            unit_tests:
              - '{test/config.json,go/**,test.go,Makefile,build.env,go.sum,go.mod,proto/*.proto,tools/**,config/**,bootstrap.sh,.github/workflows/unit_test.yml,.github/actions/setup-mysql/action.yml,.github/actions/setup-go/action.yml}'
              - '!{go/test/endtoend,go/flags/endtoend,go/mysql/endtoend,go/vt/vtctl/endtoend,go/vt/vtctl/grpcvtctldserver/endtoend,go/vt/vtgate/endtoend,go/vt/vttablet/endtoend}/**/*_test.go'

  test:
    needs: changes
    # Matrix jobs skipped at the job level report a single un-expanded check
    # name, which would leave the per-flavor required status checks pending.
    if: ${{ !cancelled() }}
    timeout-minutes: ${{ matrix.race && 45 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # mysql57 tests
          - platform: mysql57
            evalengine: "0"
            flavor: mysql-5.7

          - platform: mysql57
            evalengine: "1"
            flavor: mysql-5.7

          # mysql80 tests
          - platform: mysql80
            evalengine: "0"
            flavor: mysql-8.0

          - platform: mysql80
            evalengine: "1"
            flavor: mysql-8.0

          # mysql84 tests
          - platform: mysql84
            evalengine: "0"
            flavor: mysql-8.4

          - platform: mysql84
            evalengine: "1"
            flavor: mysql-8.4

          # Race tests (mysql80 only)
          - platform: mysql80
            evalengine: "0"
            flavor: mysql-8.0
            race: true

          - platform: mysql80
            evalengine: "1"
            flavor: mysql-8.0
            race: true

