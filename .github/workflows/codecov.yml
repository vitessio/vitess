name: Code Coverage
on:
  schedule:
    - cron: '0 0 * * 6'  # Saturday midnight UTC
  # No push trigger: a push has no pull request base to diff against, so push
  # runs only ever failed (on Go changes) or skipped the upload.
  pull_request:
    branches: '**'
concurrency:
  group: format('{0}-{1}-{2}', ${{ github.ref }}, ${{ github.event_name }}, 'Code Coverage')
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Path filtering and changed-package detection run here, on a GitHub-hosted
  # runner, so that the coverage job below (on a large runner) is not started
  # at all when there is nothing to measure. Code Coverage is not a required
  # check, so skipping it at the job level reports nothing misleading.
  changes:
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'Backport')
    runs-on: ${{ github.repository_owner == 'vitessio' && 'cncf-ubuntu-4-16-x86' || 'ubuntu-24.04' }}
    timeout-minutes: 10
    outputs:
      can_upload: ${{ steps.upload.outputs.can_upload }}
      is_full_run: ${{ steps.mode.outputs.is_full_run }}
      packages: ${{ steps.packages.outputs.packages }}
    steps:
    # Codecov accepts uploads without a token only from public repositories, so a private repository without the
    # CODECOV_TOKEN secret, such as vitess-security, skips the coverage job instead of failing its upload.
    - name: Check whether the coverage report can be uploaded
      id: upload
      env:
        CAN_UPLOAD: ${{ !github.event.repository.private || secrets.CODECOV_TOKEN != '' }}
      run: echo "can_upload=$CAN_UPLOAD" >> "$GITHUB_OUTPUT"

    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Full history is needed to diff the pull request's base and head.
        fetch-depth: 0
        persist-credentials: 'false'

    - name: Determine run mode
      id: mode
      run: |
        if [ "${{ github.event_name }}" = "schedule" ]; then
          echo "is_full_run=true" >> "$GITHUB_OUTPUT"
        else
          echo "is_full_run=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Find the base of the pull request's merge commit
      # github.event.pull_request.base.sha is not updated when the base branch
      # moves, so paths-filter would also count the base branch's newer commits.
      # With token: '', paths-filter diffs against `base` on pull_request
      # events too (see its README); action.yml's input description is stale.
      id: merge-base
      if: github.event_name == 'pull_request'
      run: echo "sha=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"

    - name: Check for changes in files relevant to code coverage
      if: steps.mode.outputs.is_full_run != 'true'
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      id: changes
      with:
        token: ''
        base: ${{ steps.merge-base.outputs.sha }}
        # With 'every', a file is relevant only if it matches all patterns: any
        # path from the brace-list, and not a test file in one of the endtoend
        # test packages, which the coverage run never tests and which cannot
        # be imported by unit tests. The endtoend trees are enumerated explicitly
        # so that testdata fixtures whose paths merely contain an endtoend
        # directory (e.g. under go/tools/ci-config) still count as relevant.
        predicate-quantifier: 'every'
        filters: |
          changed_files:
            - '{.github/workflows/codecov.yml,.github/actions/setup-mysql/action.yml,.github/actions/tune-os/**,.github/actions/setup-go/action.yml,go/**,go.mod,go.sum,Makefile}'
            - '!{go/test/endtoend,go/flags/endtoend,go/mysql/endtoend,go/vt/vtctl/endtoend,go/vt/vtctl/grpcvtctldserver/endtoend,go/vt/vtgate/endtoend,go/vt/vttablet/endtoend}/**/*_test.go'

    # Needed by `go list` in the next step.
    - name: Set up Go
      if: steps.mode.outputs.is_full_run != 'true' && steps.changes.outputs.changed_files == 'true'
      uses: $/.github/actions/setup-go
      with:
        build-cache: none
        go-tools: none

    - name: Detect changed Go packages
      if: steps.mode.outputs.is_full_run != 'true' && steps.changes.outputs.changed_files == 'true'
      id: packages
      run: |
        BASE_SHA="${{ github.event.pull_request.base.sha }}"
        HEAD_SHA="${{ github.event.pull_request.head.sha }}"
        CHANGED_GO_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- '*.go')

        if [ -z "$CHANGED_GO_FILES" ]; then
          echo "BASE_SHA=$BASE_SHA"
          echo "HEAD_SHA=$HEAD_SHA"
          echo "packages=$PACKAGES"

          echo "packages=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        PACKAGE_DIRS=$(echo "$CHANGED_GO_FILES" | xargs -n1 dirname | sort -u)

        # Validate as Go packages and exclude endtoend tests. Only consider
        # paths under go/; anything else (e.g. ".", "changelog", ".github")
        # would expand to ./.../... and pull in the full endtoend suite.
        PACKAGES=""
        for dir in $PACKAGE_DIRS; do
          case "$dir" in
            go/*) ;;
            *) continue ;;
          esac
          case "$dir" in
            */endtoend*|go/cmd/vttestserver*) continue ;;
          esac
          if go list "./$dir" >/dev/null 2>&1; then
            PACKAGES="${PACKAGES:+$PACKAGES }$dir"
          fi
        done

        echo "BASE_SHA=$BASE_SHA"
        echo "HEAD_SHA=$HEAD_SHA"
        echo "packages=$PACKAGES"

        echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.can_upload == 'true' && (needs.changes.outputs.is_full_run == 'true' || needs.changes.outputs.packages != '')
    name: Code Coverage
    runs-on: ${{ github.repository_owner == 'vitessio' && 'oracle-vm-8cpu-32gb-x86-64' || (github.repository_owner == 'vitessio' && 'cncf-ubuntu-4-16-x86' || 'ubuntu-24.04') }}

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
      with:
        egress-policy: audit

    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: 'false'

    - name: Set up Go
      uses: $/.github/actions/setup-go
      with:
        # The coverage build uses its own flags; only its "make build" step
        # reuses the build entry.
        build-cache: build
        # tools/run_codecov.sh runs go test directly, without gotestsum.
        go-tools: none

    - name: Set up python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0

    - name: Tune the OS
      timeout-minutes: 5
      uses: $/.github/actions/tune-os

    - name: Setup MySQL
      timeout-minutes: 8
      uses: $/.github/actions/setup-mysql
      with:
        flavor: mysql-8.4

    - name: Get dependencies
      timeout-minutes: 5
      run: |
        export DEBIAN_FRONTEND="noninteractive"
        sudo apt-get update

        sudo apt-get install -y make unzip g++ curl git wget

    - name: Run make tools
      timeout-minutes: 10
      run: |
        make BUILD_JAVA=0 BUILD_PROTOC=0 tools

    - name: Run coverage tests
      timeout-minutes: 60
      env:
        IS_FULL_RUN: ${{ needs.changes.outputs.is_full_run }}
        COVERAGE_PACKAGES: ${{ needs.changes.outputs.packages }}
      run: |
        set -exo pipefail
        export VTDATAROOT="/tmp/"
        export NOVTADMINBUILD=1
        source build.env

        if [ "$IS_FULL_RUN" = "true" ]; then
          make unit_test_cover
        else
          make COVERAGE_PACKAGES="$COVERAGE_PACKAGES" unit_test_cover
        fi

    - name: Upload coverage reports
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        files: coverage.out
        fail_ci_if_error: true
        verbose: true
        flags: ${{ needs.changes.outputs.is_full_run != 'true' && 'partial' || '' }}
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
