name: 'Setup MySQL'
description: 'Set up MySQL server for use in GitHub Actions workflows'
inputs:
  flavor:
    description: 'The flavor of MySQL to use (e.g. mysql-5.7, mysql-8.0, mysql-8.4)'
    required: true
runs:
  using: "composite"
  steps:
    - name: Setup MySQL
      shell: bash -e {0}
      env:
        FLAVOR: ${{ inputs.flavor }}
      run: "${GITHUB_ACTION_PATH}/setup-mysql.sh"
