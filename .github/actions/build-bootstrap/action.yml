name: "Build Bootstrap Image"
description: "Build a Vitess bootstrap Docker image locally"

inputs:
  bootstrap-version:
    description: "Bootstrap image version tag"
    required: false
    default: "ci"
  bootstrap-flavor:
    description: "Bootstrap image flavor (e.g. mysql84)"
    required: false
    default: "mysql84"
  cache-export:
    description: "Export the build cache to the GitHub Actions cache. Only one job per push should do this, and only on branches whose cache other builds can read (main and release branches)."
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

    # The flavor is built as a single build that includes the common stage.
    # Building the common image as a separate build in the same run makes
    # BuildKit miss the cache for the flavor's own steps
    # (https://github.com/docker/buildx/issues/414).
    - name: Build bootstrap image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        # Build from the checked-out code. Without a context, the action
        # makes BuildKit fetch the repository from GitHub again.
        context: .
        file: docker/bootstrap/Dockerfile
        target: ${{ inputs.bootstrap-flavor }}
        tags: vitess/bootstrap:${{ inputs.bootstrap-version }}-${{ inputs.bootstrap-flavor }}
        load: true
        cache-from: type=gha,scope=bootstrap-${{ inputs.bootstrap-flavor }}
        cache-to: ${{ inputs.cache-export == 'true' && format('type=gha,scope=bootstrap-{0},mode=max', inputs.bootstrap-flavor) || '' }}
