    # Jobs only restore caches. The go_cache_warm workflow is the only writer:
    # on every push to main it saves a module cache entry for each go.sum that
    # changed, and fresh build cache entries for that commit, keyed so that
    # the keys and prefixes below restore the newest one.
    - name: Determine cache entries
      id: entries
      shell: bash
      env:
        BUILD_ENTRIES: ${{ inputs.build-cache }}
        GO_TOOLS: ${{ inputs.go-tools }}
      run: |
        IFS=',' read -r -a entries <<< "${BUILD_ENTRIES}"
        for entry in "${entries[@]}"; do
          case "${entry}" in
          build | unit | race | tools) echo "${entry}=true" >> "${GITHUB_OUTPUT}" ;;
          none) ;;
          *)
            echo "::error::Unknown build-cache entry '${entry}' in '${BUILD_ENTRIES}': expected a comma-separated list of build, unit, race and tools, or none"
            exit 1
            ;;
          esac
        done

        tools=()
        IFS=',' read -r -a entries <<< "${GO_TOOLS}"
        for entry in "${entries[@]}"; do
          case "${entry}" in
          addlicense | gofumpt | goimports | golangci-lint | gotestsum | goyacc)
            echo "tool-${entry}=true" >> "${GITHUB_OUTPUT}"
            tools+=("${entry}")
            ;;
          none) ;;
          *)
            echo "::error::Unknown go-tools entry '${entry}' in '${GO_TOOLS}': expected a comma-separated list of addlicense, gofumpt, goimports, golangci-lint, gotestsum and goyacc, or none"
            exit 1
            ;;
          esac
        done
        echo "go-tools=${tools[*]}" >> "${GITHUB_OUTPUT}"

    # One module cache entry per go.sum, keyed by its hash, so that a tool's
    # dependency update only replaces that tool's entry. The entries restore
    # into the same module cache; modules they share are identical.
    #
    # Go makes the modules it downloads read-only, and tar cannot extract over
    # them, which fails the restore. The upgrade/downgrade workflows build the
    # previous release's tree first, which downloads its modules, so make what
    # is already there writable.
    - name: Make the Go module cache writable
      if: inputs.cache == 'true'
      shell: bash
      run: |
        if [ -d ~/go/pkg/mod ]; then
          chmod -R u+w ~/go/pkg/mod
        fi

    - name: Restore Go module cache (root)
      if: inputs.cache == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
