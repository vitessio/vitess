name: "Set up Go"
description: "Set up Go and restore the shared module and build caches"
inputs:
  cache:
    description: "Whether to restore the Go module and build caches"
    default: "true"
  build-cache:
    description: >-
      Comma-separated build cache entries to restore, for example
      "build,unit". Each is filled by the go_cache_warm workflow (see
      tools/warm_go_build_cache.sh): "build" for make build and the
      end-to-end tests, "unit" for the unit tests, "race" for the race tests,
      "tools" for the static checks, which also restores the golangci-lint
      analysis cache. "none" restores no build cache.
    default: "build"
  go-tools:
    description: >-
      Comma-separated tool modules under tools/ whose module caches to restore
      and download next to the root module's, for example
      "gotestsum,gofumpt". "none" restores and downloads only the root
      module's. Tools not listed still download on first use.
    default: "gotestsum"
runs:
  using: "composite"
  steps:
    - name: Set up Go
      id: setup-go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        # Disable built-in caching: its key includes ImageOS, which duplicates
        # entries across runner types, it stores the platform-independent
        # module cache once per platform, and it saves from pull request runs,
        # which crowds the branch-scoped entries pull requests restore from
        # out of the repository cache quota.
        cache: false

    # Jobs only restore caches. The go_cache_warm workflow is the only writer:
    # on every push to main it saves a module cache entry for each go.sum that
    # changed, and fresh build cache entries for that commit, keyed so that
    # the keys and prefixes below restore the newest one.
    - name: Determine cache entries
      id: entries
      shell: bash
      env:
        BUILD_ENTRIES: ${{ inputs.build-cache }}
        GO_TOOLS: ${{ inputs.go-tools }}
      run: |
        IFS=',' read -r -a entries <<< "${BUILD_ENTRIES}"
        for entry in "${entries[@]}"; do
          case "${entry}" in
          build | unit | race | tools) echo "${entry}=true" >> "${GITHUB_OUTPUT}" ;;
          none) ;;
          *)
            echo "::error::Unknown build-cache entry '${entry}' in '${BUILD_ENTRIES}': expected a comma-separated list of build, unit, race and tools, or none"
            exit 1
            ;;
          esac
        done

        tools=()
        IFS=',' read -r -a entries <<< "${GO_TOOLS}"
        for entry in "${entries[@]}"; do
          case "${entry}" in
          gofumpt | goimports | golangci-lint | gotestsum | goyacc)
            echo "tool-${entry}=true" >> "${GITHUB_OUTPUT}"
            tools+=("${entry}")
            ;;
          none) ;;
          *)
            echo "::error::Unknown go-tools entry '${entry}' in '${GO_TOOLS}': expected a comma-separated list of gofumpt, goimports, golangci-lint, gotestsum and goyacc, or none"
            exit 1
            ;;
          esac
        done
        echo "go-tools=${tools[*]}" >> "${GITHUB_OUTPUT}"

    # One module cache entry per go.sum, keyed by its hash, so that a tool's
    # dependency update only replaces that tool's entry. The entries restore
    # into the same module cache; modules they share are identical.
    #
    # Go makes the modules it downloads read-only, and tar cannot extract over
    # them, which fails the restore. The upgrade/downgrade workflows build the
    # previous release's tree first, which downloads its modules, so make what
    # is already there writable.
    - name: Make the Go module cache writable
      if: inputs.cache == 'true'
      shell: bash
      run: |
        if [ -d ~/go/pkg/mod ]; then
          chmod -R u+w ~/go/pkg/mod
        fi

    - name: Restore Go module cache (root)
      if: inputs.cache == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/go/pkg/mod
        key: go-mod-root-${{ hashFiles('go.sum') }}
        restore-keys: |
          go-mod-root-

    - name: Restore Go module cache (gofumpt)
      if: inputs.cache == 'true' && steps.entries.outputs.tool-gofumpt == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/go/pkg/mod
        key: go-mod-gofumpt-${{ hashFiles('tools/gofumpt/go.sum') }}
        restore-keys: |
          go-mod-gofumpt-

    - name: Restore Go module cache (goimports)
      if: inputs.cache == 'true' && steps.entries.outputs.tool-goimports == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/go/pkg/mod
        key: go-mod-goimports-${{ hashFiles('tools/goimports/go.sum') }}
        restore-keys: |
          go-mod-goimports-

    - name: Restore Go module cache (golangci-lint)
      if: inputs.cache == 'true' && steps.entries.outputs.tool-golangci-lint == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/go/pkg/mod
        key: go-mod-golangci-lint-${{ hashFiles('tools/golangci-lint/go.sum') }}
        restore-keys: |
          go-mod-golangci-lint-

    - name: Restore Go module cache (gotestsum)
      if: inputs.cache == 'true' && steps.entries.outputs.tool-gotestsum == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/go/pkg/mod
        key: go-mod-gotestsum-${{ hashFiles('tools/gotestsum/go.sum') }}
        restore-keys: |
          go-mod-gotestsum-

    - name: Restore Go module cache (goyacc)
      if: inputs.cache == 'true' && steps.entries.outputs.tool-goyacc == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/go/pkg/mod
        key: go-mod-goyacc-${{ hashFiles('tools/goyacc/go.sum') }}
        restore-keys: |
          go-mod-goyacc-

    # Each entry holds what one group of jobs compiles, with that group's
    # flags, so restoring several of them into one cache directory never
    # overlaps.
    - name: Restore Go build cache (build)
      if: inputs.cache == 'true' && steps.entries.outputs.build == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/go-build
        key: go-build-v3-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-build-${{ github.sha }}
        restore-keys: |
          go-build-v3-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-build-

    - name: Restore Go build cache (unit)
      if: inputs.cache == 'true' && steps.entries.outputs.unit == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/go-build
        key: go-build-v3-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-unit-${{ github.sha }}
        restore-keys: |
          go-build-v3-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-unit-

    - name: Restore Go build cache (race)
      if: inputs.cache == 'true' && steps.entries.outputs.race == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/go-build
        key: go-build-v3-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-race-${{ github.sha }}
        restore-keys: |
          go-build-v3-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-race-

    - name: Restore Go build cache (tools)
      if: inputs.cache == 'true' && steps.entries.outputs.tools == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/go-build
        key: go-build-v3-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-tools-${{ github.sha }}
        restore-keys: |
          go-build-v3-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-tools-

    - name: Restore golangci-lint cache
      if: inputs.cache == 'true' && steps.entries.outputs.tools == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/golangci-lint
        key: golangci-lint-v1-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ github.sha }}
        restore-keys: |
          golangci-lint-v1-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-

    # Download the root module's modules and the listed tools', so that a
    # cache miss is retried here rather than failing on first use. On a cache
    # hit this is a fast no-op. Retried because proxy.golang.org occasionally
    # drops connections mid-download.
    - name: Download Go modules
      shell: bash
      env:
        TOOLS: ${{ steps.entries.outputs.go-tools }}
      run: |
        download() {
          go mod download || return 1
          local tool
          for tool in ${TOOLS}; do
            # Older release trees, which the upgrade/downgrade workflows also
            # set up, have no tool modules.
            [ -f "tools/${tool}/go.mod" ] || continue
            go mod download -modfile="tools/${tool}/go.mod" || return 1
          done
        }

        for attempt in 1 2 3; do
          if download; then
            break
          fi
          if [ "${attempt}" = 3 ]; then
            echo "go mod download failed after ${attempt} attempts"
            exit 1
          fi
          echo "go mod download failed (attempt ${attempt}); retrying"
          sleep 10
        done
