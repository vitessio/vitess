name: "apt package cache"
description: >-
  Restore, or save, the .deb files that apt downloads, so that a job installs
  its packages without downloading them from the mirrors, which regularly
  stall for minutes. Run it with mode "restore" before the job's first apt
  install and with mode "save" after its last.
inputs:
  mode:
    description: '"restore" or "save"'
    required: true
  name:
    description: >-
      The job's set of packages, for example "cluster-mysql-8.4". Jobs that
      install the same packages share it.
    required: false
  hash:
    description: >-
      A hash of the files that choose the packages, for example
      hashFiles('.github/workflows/unit_test.yml',
      '.github/actions/setup-mysql/action.yml'), so that a change to them
      starts a new entry.
    required: false
runs:
  using: "composite"
  steps:
    # One entry per runner image, so that it holds the versions that the
    # image's mirrors serve and never grows: there are no restore-keys. The
    # GitHub-hosted runners name their image; on the others a new week starts
    # a new entry.
    - name: Determine the apt cache key
      if: inputs.mode == 'restore'
      shell: bash
      env:
        NAME: ${{ inputs.name }}
        HASH: ${{ inputs.hash }}
      run: |
        if [ -z "${NAME}" ] || [ -z "${HASH}" ]; then
          echo "::error::The apt cache needs a name and a hash"
          exit 1
        fi
        if [ -n "${ImageVersion:-}" ]; then
          image="${ImageOS:-}-${ImageVersion}"
        else
          image="$(. /etc/os-release && echo "${ID}${VERSION_ID}")-$(date -u +%G-W%V)"
        fi
        echo "APT_CACHE_KEY=apt-v1-${image}-$(dpkg --print-architecture)-${NAME}-${HASH}" >> "${GITHUB_ENV}"
        echo "APT_CACHE_DIR=/var/cache/vitess-apt" >> "${GITHUB_ENV}"
        sudo install -d -o "$(id -u)" -g "$(id -g)" /var/cache/vitess-apt

    - name: Restore the apt cache
      id: restore
      if: inputs.mode == 'restore'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /var/cache/vitess-apt/*.deb
        key: ${{ env.APT_CACHE_KEY }}

    # apt downloads into partial/ as its _apt user, then moves the files up.
    - name: Point apt at the cache
      if: inputs.mode == 'restore'
      shell: bash
      env:
        HIT: ${{ steps.restore.outputs.cache-hit }}
      run: |
        sudo install -d -o _apt -g root -m 0700 "${APT_CACHE_DIR}/partial"
        sudo tee /etc/apt/apt.conf.d/99vitess-apt-cache > /dev/null <<EOF
        Dir::Cache::Archives "${APT_CACHE_DIR}/";
        APT::Keep-Downloaded-Packages "true";
        Binary::apt::APT::Keep-Downloaded-Packages "true";
        EOF
        echo "APT_CACHE_HIT=${HIT:-false}" >> "${GITHUB_ENV}"
        echo "Restored $(find "${APT_CACHE_DIR}" -maxdepth 1 -name '*.deb' | wc -l) packages ($(du -sh "${APT_CACHE_DIR}" | cut -f1))"

    - name: Report the apt cache
      if: inputs.mode == 'save'
      shell: bash
      run: |
        echo "apt cache: $(find "${APT_CACHE_DIR}" -maxdepth 1 -name '*.deb' | wc -l) packages ($(du -sh "${APT_CACHE_DIR}" | cut -f1)), restored: ${APT_CACHE_HIT}"

    # Only main and release branches save, so that pull requests restore their
    # entries rather than crowd them out of the repository's cache quota.
    - name: Save the apt cache
      if: inputs.mode == 'save' && env.APT_CACHE_HIT != 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-'))
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /var/cache/vitess-apt/*.deb
        key: ${{ env.APT_CACHE_KEY }}
