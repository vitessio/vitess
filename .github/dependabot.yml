version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    # Dependabot only updates direct requirements unless told otherwise, and Go
    # marks a module required only for a tool directive as "// indirect". Name
    # those tool modules here, or Dependabot never bumps them.
    allow:
      - dependency-type: "direct"
      - dependency-name: "google.golang.org/grpc/cmd/protoc-gen-go-grpc"
        dependency-type: "all"
    groups:
      go:
        patterns:
          - "*"
        exclude-patterns:
          - "google.golang.org/protobuf"
          - "google.golang.org/grpc/cmd/protoc-gen-go-grpc"
          - "github.com/planetscale/vtprotobuf"
          - "github.com/dave/jennifer"
          - "golang.org/x/tools"
      # These modules can influence the content of committed generated files:
      # the protoc plugins (protoc-gen-go, protoc-gen-go-grpc,
      # protoc-gen-go-vtproto) stamp their versions into the proto stubs, and
      # jennifer/x/tools drive the AST code generators (sizegen, asthelpergen,
      # astfmtgen, vtctldclient). Bumping them fails the CI staleness checks
      # (check_make_proto, check_make_sizegen, ...) until a human regenerates
      # (`make proto` / `make codegen`) and pushes the result, so keep them in
      # their own group to not block the main go group.
      codegen:
        patterns:
          - "google.golang.org/protobuf"
          - "google.golang.org/grpc/cmd/protoc-gen-go-grpc"
          - "github.com/planetscale/vtprotobuf"
          - "github.com/dave/jennifer"
          - "golang.org/x/tools"

  # Every requirement in a tools/* module is "// indirect", because the module
  # exists only for its tool directive. Each tool gets its own entry that
  # allows the tool module itself and nothing else, so each bump is its own PR
  # and the tool's own dependencies stay at the versions it pins.
  - package-ecosystem: "gomod"
    directory: "/tools/addlicense"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    allow:
      - dependency-name: "github.com/google/addlicense"
        dependency-type: "all"

  - package-ecosystem: "gomod"
    directory: "/tools/gofumpt"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    allow:
      - dependency-name: "mvdan.cc/gofumpt"
        dependency-type: "all"

  - package-ecosystem: "gomod"
    directory: "/tools/goimports"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    allow:
      - dependency-name: "golang.org/x/tools"
        dependency-type: "all"

  - package-ecosystem: "gomod"
    directory: "/tools/golangci-lint"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    allow:
      - dependency-name: "github.com/golangci/golangci-lint/v2"
        dependency-type: "all"

  - package-ecosystem: "gomod"
    directory: "/tools/gotestsum"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    allow:
      - dependency-name: "gotest.tools/gotestsum"
        dependency-type: "all"

  - package-ecosystem: "gomod"
    directory: "/tools/goyacc"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    allow:
      - dependency-name: "github.com/vitessio/goyacc"
        dependency-type: "all"

  - package-ecosystem: "github-actions"
    # "/" only covers .github/workflows; the composite actions must be listed.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "maven"
    directory: "/java"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      java:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/web/vtadmin"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 30
    ignore:
      # typescript-eslint can't support TypeScript 7 until TypeScript 7 provides a compiler API:
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: "typescript"
        versions:
          - ">= 7"
    groups:
      vtadmin-npm:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/docker/binaries/*"
      - "/docker/bootstrap"
      - "/docker/lite"
      - "/docker/mini"
      - "/docker/vttestserver"
      - "/examples/compose/external_db/mysql"
      - "/go/mysql/collations/tools/colldump"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "mysql"
        versions:
          - ">= 8.5"
    groups:
      docker:
        patterns:
          - "*"

  # Maintained release branches. Dependabot reads this file only from main, so
  # each release branch gets its own entries through target-branch. A release
  # branch takes every GitHub Actions update, so that deprecated action runtimes
  # get replaced, but no major version of anything it ships. The Go minor
  # version of a release branch is fixed, and the Update Golang Version workflow
  # bumps its patch version, so Dependabot leaves the golang images alone beyond
  # patch versions. The tools/* modules only matter for development and stay
  # at the versions the release branch pinned.
  #
  # Add a release branch here when it is created and remove it when it reaches
  # its end of life, together with the Update Golang Version workflow.

  - package-ecosystem: "gomod"
    directory: "/"
    target-branch: "release-24.0"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    commit-message:
      prefix: "[release-24.0] build(deps)"
    allow:
      - dependency-type: "direct"
      - dependency-name: "google.golang.org/grpc/cmd/protoc-gen-go-grpc"
        dependency-type: "all"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      go:
        patterns:
          - "*"
        exclude-patterns:
          - "google.golang.org/protobuf"
          - "google.golang.org/grpc/cmd/protoc-gen-go-grpc"
          - "github.com/planetscale/vtprotobuf"
          - "github.com/dave/jennifer"
          - "golang.org/x/tools"
      codegen:
        patterns:
          - "google.golang.org/protobuf"
          - "google.golang.org/grpc/cmd/protoc-gen-go-grpc"
          - "github.com/planetscale/vtprotobuf"
          - "github.com/dave/jennifer"
          - "golang.org/x/tools"

  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    target-branch: "release-24.0"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    commit-message:
      prefix: "[release-24.0] build(deps)"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "maven"
    directory: "/java"
    target-branch: "release-24.0"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    commit-message:
      prefix: "[release-24.0] build(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      java:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/web/vtadmin"
    target-branch: "release-24.0"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 30
    commit-message:
      prefix: "[release-24.0] build(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      vtadmin-npm:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/docker/binaries/*"
      - "/docker/bootstrap"
      - "/docker/lite"
      - "/docker/mini"
      - "/docker/vttestserver"
      - "/go/mysql/collations/tools/colldump"
    target-branch: "release-24.0"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    commit-message:
      prefix: "[release-24.0] build(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "golang"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "mysql"
        versions:
          - ">= 8.5"
    groups:
      docker:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/"
    target-branch: "release-23.0"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    commit-message:
      prefix: "[release-23.0] build(deps)"
    allow:
      - dependency-type: "direct"
      - dependency-name: "google.golang.org/grpc/cmd/protoc-gen-go-grpc"
        dependency-type: "all"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      go:
        patterns:
          - "*"
        exclude-patterns:
          - "google.golang.org/protobuf"
          - "google.golang.org/grpc/cmd/protoc-gen-go-grpc"
          - "github.com/planetscale/vtprotobuf"
          - "github.com/dave/jennifer"
          - "golang.org/x/tools"
      codegen:
        patterns:
          - "google.golang.org/protobuf"
          - "google.golang.org/grpc/cmd/protoc-gen-go-grpc"
          - "github.com/planetscale/vtprotobuf"
          - "github.com/dave/jennifer"
          - "golang.org/x/tools"

  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    target-branch: "release-23.0"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    commit-message:
      prefix: "[release-23.0] build(deps)"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "maven"
    directory: "/java"
    target-branch: "release-23.0"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    commit-message:
      prefix: "[release-23.0] build(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # This branch stays on Netty 4.1. gRPC Java builds on Netty 4.2 from
      # 1.83 on.
      - dependency-name: "io.netty:*"
        versions:
          - ">= 4.2"
      - dependency-name: "io.grpc:*"
        versions:
          - ">= 1.83"
    groups:
      java:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/web/vtadmin"
    target-branch: "release-23.0"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 30
    commit-message:
      prefix: "[release-23.0] build(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      vtadmin-npm:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/docker/binaries/*"
      - "/docker/bootstrap"
      - "/docker/lite"
      - "/docker/mini"
      - "/docker/vttestserver"
      - "/examples/compose/external_db/mysql"
      - "/go/mysql/collations/tools/colldump"
    target-branch: "release-23.0"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    commit-message:
      prefix: "[release-23.0] build(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "golang"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "mysql"
        versions:
          - ">= 8.5"
    groups:
      docker:
        patterns:
          - "*"
