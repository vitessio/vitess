\* Two RMs, one tablet restart and one resolution attempt.
\* All the listed invariants hold (about 2 million distinct states).
CONSTANTS
    MM = mm
    r1 = r1
    r2 = r2
    RMs = {r1, r2}
    Resolvers = {v1}
    MaxCrashes = 1
    MaxResolves = 1
    RedoPendingFix = TRUE
    NonRetryable = TRUE

SPECIFICATION Spec
SYMMETRY RMSymmetry
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    CommitNeedsDecision
    DecisionConsistent
    CommitDurable
    NoLostCommit
