\* Two RMs, one tablet restart and one resolution attempt.
\* All the listed invariants hold.
CONSTANTS
    MM = mm
    r1 = r1
    r2 = r2
    RMs = {r1, r2}
    Resolvers = {v1}
    MaxCrashes = 1
    MaxResolves = 1
    FixRedoPending = TRUE
    FixDTIDLock = TRUE
    FixKeepLocks = TRUE
    NonRetryable = TRUE
    RetryableLockLoss = TRUE

SPECIFICATION Spec
SYMMETRY RMSymmetry
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    CommitNeedsDecision
    DecisionConsistent
    CommitDurable
    NoLostCommit
    NoOrphanPrepare
