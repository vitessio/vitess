\* Without the DTID lock. NoOrphanPrepare is violated: a RollbackPrepared runs
\* while a timed-out Prepare saves its redo log.
CONSTANTS
    MM = mm
    r1 = r1
    r2 = r2
    RMs = {r1}
    Resolvers = {v1, v2}
    MaxCrashes = 2
    MaxResolves = 2
    FixRedoPending = TRUE
    FixDTIDLock = FALSE
    FixKeepLocks = TRUE
    NonRetryable = FALSE
    RetryableLockLoss = TRUE

SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS
    NoOrphanPrepare
