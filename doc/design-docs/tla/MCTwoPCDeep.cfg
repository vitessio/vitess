\* One RM, two tablet restarts and two resolution attempts, with two
\* resolvers. All the listed invariants hold.
CONSTANTS
    MM = mm
    r1 = r1
    r2 = r2
    RMs = {r1}
    Resolvers = {v1, v2}
    MaxCrashes = 2
    MaxResolves = 2
    RedoPendingFix = TRUE
    NonRetryable = TRUE

SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    CommitNeedsDecision
    DecisionConsistent
    CommitDurable
    NoLostCommit
