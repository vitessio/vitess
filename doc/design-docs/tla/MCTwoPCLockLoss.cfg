\* With retryable redo and commit failures. LocksHeld is violated: these
\* failures release the row locks while the redo log stays prepared.
CONSTANTS
    MM = mm
    r1 = r1
    r2 = r2
    RMs = {r1}
    Resolvers = {v1, v2}
    MaxCrashes = 2
    MaxResolves = 2
    FixRedoPending = TRUE
    FixDTIDLock = TRUE
    FixKeepLocks = TRUE
    NonRetryable = TRUE
    RetryableLockLoss = TRUE

SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS
    LocksHeld
