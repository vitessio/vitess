\* Without the redo-pending fix. NoLostCommit is violated: a retryable redo
\* failure lets CommitPrepared report success, and the transaction is
\* concluded without the RM's writes.
CONSTANTS
    MM = mm
    r1 = r1
    r2 = r2
    RMs = {r1}
    Resolvers = {v1}
    MaxCrashes = 2
    MaxResolves = 2
    FixRedoPending = FALSE
    FixDTIDLock = TRUE
    FixKeepLocks = TRUE
    NonRetryable = TRUE
    RetryableLockLoss = TRUE

SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    CommitNeedsDecision
    DecisionConsistent
    CommitDurable
    NoLostCommit
