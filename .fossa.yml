version: 3

project:
  id: vitess
  name: vitess

# Exclude the maven based scanning of our java client until we can get it working again.
targets:
  exclude:
    - type: maven
      path: java

# Exclude the Go modules under tools/. They pin developer tooling (linters,
# formatters, test runners) that is built and run during development and CI,
# but is not part of the Vitess code or its distributed binaries.
paths:
  exclude:
    - ./tools
